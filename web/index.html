<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palworld 据点监控</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Light palette (default) */
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-raised: #eef2f7;
      --border: rgba(15,23,42,0.09);
      --border-hover: rgba(15,23,42,0.18);
      --text: #0f172a;
      --text-dim: #52627a;
      --text-faint: #8b98ac;
      --cyan: #0284c7;
      --green: #059669;
      --amber: #b45309;
      --rose: #be123c;
      --indigo: #4338ca;
      --overlay-hairline: rgba(15,23,42,0.06);
      --overlay-soft: rgba(15,23,42,0.03);
      --overlay-hover: rgba(15,23,42,0.05);
      --overlay-track: rgba(15,23,42,0.08);
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', system-ui, sans-serif;
    }
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --surface: #131926;
      --surface-raised: #1a2234;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --text: #e2e8f0;
      --text-dim: #7a8ba8;
      --text-faint: #4a5c78;
      --cyan: #38bdf8;
      --green: #34d399;
      --amber: #fbbf24;
      --rose: #fb7185;
      --indigo: #818cf8;
      --overlay-hairline: rgba(255,255,255,0.03);
      --overlay-soft: rgba(255,255,255,0.02);
      --overlay-hover: rgba(255,255,255,0.04);
      --overlay-track: rgba(255,255,255,0.06);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ─── Layout Shell ─── */
    /* 1200px, not wider: every row on this page is a short label paired
       with a short number, and stretching those pairs across a 1680px
       desktop put the value nearer the *next* label than its own. The
       measure is the readability constraint here, not the screen. */
    .shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ─── Top Bar ─── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .topbar-left h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .server-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--green) 12%, transparent);
      color: var(--green);
      border: 1px solid color-mix(in srgb, var(--green) 25%, transparent);
    }
    .server-pill.offline {
      background: color-mix(in srgb, var(--rose) 12%, transparent);
      color: var(--rose);
      border-color: color-mix(in srgb, var(--rose) 25%, transparent);
    }
    .server-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
    }
    .topbar-right-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .topbar-right {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-family: var(--mono);
    }
    .theme-toggle {
      font-size: 0.95rem;
      line-height: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.5rem;
      cursor: pointer;
      color: var(--text-dim);
    }
    .theme-toggle:hover { background: var(--overlay-hover); color: var(--text); }
    .server-uptime {
      font-size: 0.75rem;
      color: var(--text-faint);
      font-family: var(--mono);
    }
    .stale-badge {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--amber);
      background: color-mix(in srgb, var(--amber) 12%, transparent);
      border-radius: 6px;
      padding: 0.15rem 0.55rem;
    }
    /* A failed poll is a harder failure than stale save data — the whole
       page is frozen, not just the base numbers — so it reads in rose. */
    .stale-badge.fetch-fail {
      color: var(--rose);
      background: color-mix(in srgb, var(--rose) 12%, transparent);
    }

    /* ─── Stats Strip ─── */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.5rem;
    }
    .stat-cell {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%),
        var(--surface);
      border: 1px solid color-mix(in srgb, var(--accent) 18%, var(--border));
      border-radius: 10px;
      padding: 0.7rem 0.9rem 0.7rem 1rem;
    }
    /* Colour rail down the left edge, matching the number in the cell. */
    .stat-cell::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent);
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 600;
    }
    .stat-value {
      font-size: 1.4rem;
      font-weight: 800;
      font-family: var(--mono);
      margin-top: 0.15rem;
      line-height: 1.2;
    }
    .stat-sub {
      font-size: 0.7rem;
      color: var(--text-faint);
      font-family: var(--mono);
    }

    /* ─── Memory Chart ─── */
    .chart-meta {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0.85rem 0;
      font-size: 0.7rem;
      color: var(--text-faint);
      font-family: var(--mono);
    }
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      padding: 0.6rem 0.85rem 0;
      font-size: 0.72rem;
      color: var(--text-dim);
    }
    .chart-legend .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      appearance: none;
      font: inherit;
      color: inherit;
      background: none;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.15rem 0.5rem;
      cursor: pointer;
    }
    .chart-legend .legend-item:hover { border-color: var(--border-hover); }
    /* A switched-off series keeps its current reading legible — the number
       is still true, it's just not drawn — so this dims rather than hides,
       and hollows out the swatch to say "not on the chart". */
    .chart-legend .legend-item.off { opacity: 0.5; }
    .chart-legend .legend-item.off .legend-dot {
      background: transparent !important;
      box-shadow: inset 0 0 0 2px var(--text-faint);
    }
    .chart-legend .legend-item.off b { color: var(--text-faint); }
    .chart-legend .legend-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex: none;
    }
    .chart-legend b {
      color: var(--text);
      font-family: var(--mono);
      font-weight: 700;
    }
    .chart-wrap {
      position: relative;
      padding: 0.35rem 0.75rem 0.6rem;
    }
    .chart-svg {
      width: 100%;
      height: auto;
      aspect-ratio: 1000 / 220;
      display: block;
      overflow: visible;
    }
    .chart-tooltip {
      position: absolute;
      transform: translate(-50%, -115%);
      background: var(--surface-raised);
      border: 1px solid var(--border-hover);
      border-radius: 8px;
      padding: 0.4rem 0.65rem;
      font-family: var(--mono);
      pointer-events: none;
      white-space: nowrap;
      display: none;
      z-index: 5;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }
    .mt-time { display: block; font-size: 0.65rem; color: var(--text-faint); margin-bottom: 0.2rem; }
    .mt-val { display: block; font-size: 0.75rem; font-weight: 700; line-height: 1.5; }

    /* ─── Tabs ─── */
    /* Sticky: 据点详情 is several screens tall, and without this you have to
       scroll all the way back up just to switch tabs. */
    .tab-nav {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
    }
    .tab-btn {
      appearance: none;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-dim);
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }
    .tab-badge {
      display: inline-block;
      margin-left: 0.3rem;
      padding: 0.05rem 0.45rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-family: var(--mono);
      background: color-mix(in srgb, var(--rose) 16%, transparent);
      color: var(--rose);
      vertical-align: 1px;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ─── Base Panel Layout ─── */
    /* minmax(0, 1fr), not 1fr: a grid item's automatic minimum size is its
       min-content width, so the 1fr track used to blow out to whatever the
       widest roster needed and push the whole page sideways on a narrow
       window. It only stayed hidden because the roster's wrapper scrolls;
       the moment it hands that overflow back to pin its header, the blowout
       would be real. */
    .bases-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; align-items: start; }

    /* ─── Base Panel ─── */
    /* Each base panel is tinted with its own colour — the accent rail on
       top, the header wash, the badge and every section marker — so a
       glance at any part of a long panel says which base you're reading
       without scrolling back to the title. */
    .base-panel {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      /* clip, not hidden: both keep ::before's accent bar inside the rounded
         corners, but `hidden` makes this a scroll container, and a scroll
         container captures every position:sticky descendant — the roster
         header below would then stick to this panel instead of the page. */
      overflow: clip;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    }
    .base-panel::before {
      content: '';
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--base-color), transparent 65%);
    }
    .base-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.15rem 0.8rem;
      background: linear-gradient(90deg,
        color-mix(in srgb, var(--base-color) 14%, transparent),
        color-mix(in srgb, var(--base-color) 3%, transparent) 45%,
        transparent);
      border-bottom: 1px solid var(--border);
    }
    .base-title {
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem 0.5rem;
    }
    /* Keeps "🏯 3号据点" on one line when the header wraps on a phone —
       it used to break between the icon and the name. */
    .base-title-name { white-space: nowrap; }
    .base-badge {
      font-size: 0.7rem;
      font-weight: 700;
      font-family: var(--mono);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--base-color) 14%, transparent);
      color: var(--base-color);
    }
    .base-food-inline {
      font-size: 0.72rem;
      font-weight: 400;
      font-family: var(--mono);
      color: var(--text-faint);
      white-space: nowrap;
    }
    .base-food-inline.low { color: var(--amber); font-weight: 600; }
    .base-food-inline.critical {
      color: var(--rose);
      font-weight: 700;
      background: color-mix(in srgb, var(--rose) 10%, transparent);
      border-radius: 6px;
      padding: 0.1rem 0.45rem;
    }
    /* What the base is for (backend-classified) — deliberately quieter
       than .base-badge: it labels the panel, it isn't a live number. */
    .base-role {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      background: color-mix(in srgb, var(--text-faint) 12%, transparent);
      color: var(--text-dim);
      white-space: nowrap;
    }
    .base-role.stalled { color: var(--amber); background: color-mix(in srgb, var(--amber) 12%, transparent); }
    .role-tag {
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--text-faint);
    }
    /* One base at a time — .base-tab-btn picks which. Hidden rather than
       not rendered: every panel stays in the DOM and keeps being filled in
       on each poll, so switching is instant and never shows stale data. */
    .base-panel { display: none; }
    .base-panel.active { display: block; }

    /* ─── Base switcher ─── */
    /* Sticky directly under .tab-nav, so the switcher stays reachable
       part-way down a panel that runs several screens. The offset is that
       bar's measured height (48.78px at the default font size; .tab-nav
       never wraps, so it doesn't vary) rounded *down* — a rounding that
       overlaps by a fraction of a pixel is invisible, one that leaves a
       gap shows a sliver of scrolling content between the two bars. */
    .base-tab-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      position: sticky;
      top: 48px;
      z-index: 19;
      background: var(--bg);
      padding: 0.15rem 0 0.85rem;
    }
    .base-tab-btn {
      appearance: none;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      white-space: nowrap;
    }
    .base-tab-btn:hover { border-color: var(--border-hover); color: var(--text); }
    /* Each tab carries its base's own colour (the same one its food chart
       is drawn in, passed in as --base-color), so the selected tab and the
       panel below it read as the same thing. */
    .base-tab-btn.active {
      color: var(--base-color);
      border-color: var(--base-color);
      background: color-mix(in srgb, var(--base-color) 12%, transparent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--base-color) 13%, transparent),
                  0 4px 12px -6px var(--base-color);
    }
    .base-tab-count {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--text-faint);
    }
    .base-tab-btn.active .base-tab-count { color: var(--base-color); }

    /* ─── Pal Table ─── */
    .pal-table {
      width: 100%;
      border-collapse: collapse;
    }
    .pal-table th {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .pal-table th:last-child { text-align: right; }
    .pal-table td {
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--overlay-hairline);
      vertical-align: middle;
    }
    .pal-table tr:last-child td { border-bottom: none; }
    .pal-table tr:hover td { background: var(--overlay-soft); }

    .pal-name-cell {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .pal-type {
      font-size: 0.68rem;
      color: var(--text-faint);
      font-family: var(--mono);
    }
    .job-cell {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }
    .job-ratio {
      font-size: 0.68rem;
      color: var(--text-faint);
      font-family: var(--mono);
    }

    /* Work-suitability filter above each base's pal table. Each chip
       names the suitability, how many pals at this base have it, and
       which of this base's placed facilities it staffs — so picking a
       chip answers "who can run that facility" directly. */
    .pal-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      padding: 0 0 0.6rem;
    }
    .pal-filter-chip {
      appearance: none;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.25rem 0.5rem;
      font-size: 0.72rem;
      color: var(--text-dim);
      cursor: pointer;
      display: inline-flex;
      align-items: baseline;
      gap: 0.3rem;
      max-width: 100%;
    }
    .pal-filter-chip:hover { border-color: var(--border-hover); color: var(--text); }
    .pal-filter-chip.active {
      background: color-mix(in srgb, var(--base-color, var(--cyan)) 12%, transparent);
      border-color: var(--base-color, var(--cyan));
      color: var(--base-color, var(--cyan));
    }
    .pfc-count { font-family: var(--mono); font-size: 0.68rem; opacity: 0.75; }

    /* Pal roster / work-suitability matrix. One narrow numeric column per
       suitability makes the table wider than a half-width base panel at
       most window sizes, so it scrolls inside its own container rather
       than pushing the page sideways. */
    .pal-table-wrap { overflow-x: auto; }
    /* The roster is the tallest thing on the page (~900px, well past a
       screen), so its header is pinned while you scroll past it. That only
       works when this wrapper is *not* a scroll container: a sticky header
       inside a horizontally scrolling box anchors to that box rather than to
       the page, and — since the box never scrolls vertically — would simply
       sit shoved 97px down on top of the first rows. So the wrapper hands
       back its overflow whenever the matrix fits (see syncPalHeadPin), and
       takes it again, losing the pin, on windows too narrow for it. */
    .pal-table-wrap.pinned-head { overflow-x: visible; }
    /* 97px = .tab-nav (48.78) + .base-tab-nav (49.77), rounded down so the
       header tucks a fraction *under* the base switcher rather than leaving
       a sliver of scrolling rows between them. Both bars are single-row at
       the widths where pinning is on, so the sum doesn't vary. */
    .pal-table-wrap.pinned-head thead th {
      position: sticky;
      top: 97px;
      z-index: 5;
      /* Opaque, or the rows slide visibly through the header. The panel's
         own colour, since that is what the header sits on. */
      background: var(--surface);
      /* A collapsed table's borders belong to the table, not the cell, so
         th's border-bottom scrolls away and leaves the pinned header with no
         edge against the rows moving under it. An inset shadow paints inside
         the cell and travels with it. */
      box-shadow: inset 0 -1px 0 var(--border);
    }
    /* max-content, not 100%: with a dozen numeric columns added, a
       width:100% table squeezes the name/job columns into one-character-
       per-line vertical text instead of overflowing. Sizing to content and
       letting the wrapper scroll keeps every column legible. */
    .pal-matrix { width: max-content; min-width: 100%; }
    .pal-matrix .pal-name-cell, .pal-matrix .job-cell { white-space: nowrap; }
    /* 岗位 holds facility names, and the roster is wide enough that a
       right-aligned header sat inches away from the left-aligned values
       under it. */
    .pal-matrix th:last-child { text-align: left; }
    .pal-matrix td, .pal-matrix th { padding-left: 0.5rem; padding-right: 0.5rem; }
    /* The matrix is already wide; the SAN bar's 140px is mostly empty
       track, and the number beside it carries the same reading. */
    .pal-matrix .san-cell { min-width: 0; gap: 0.35rem; }
    .pal-matrix .san-track { width: 42px; flex: none; }
    .pal-matrix th.ws-col, .pal-matrix td.ws-col {
      text-align: center;
      padding-left: 0.3rem;
      padding-right: 0.3rem;
      font-family: var(--mono);
      white-space: nowrap;
    }
    .pal-matrix th.ws-col {
      font-size: 0.63rem;
      writing-mode: horizontal-tb;
    }
    .pal-matrix td.ws-col.zero { color: var(--border-hover); }
    .pal-matrix .ws-col.hl {
      background: color-mix(in srgb, var(--base-color, var(--cyan)) 10%, transparent);
      color: var(--base-color, var(--cyan));
    }
    /* Zebra rows: the roster is fifteen columns wide, and following one
       pal from its name to its 岗位 across a hairline-separated grid meant
       counting rows. Kept below the hover tint so hover still reads. */
    .pal-matrix tbody tr:nth-child(even) td { background: var(--overlay-soft); }
    .pal-matrix tbody tr:hover td { background: var(--overlay-hover); }
    .pal-matrix tfoot td {
      border-top: 1px solid var(--border-hover);
      border-bottom: none;
      background: var(--surface-raised);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .pal-matrix tfoot td.short { color: var(--rose); }

    .lv-badge {
      font-size: 0.68rem;
      font-weight: 700;
      font-family: var(--mono);
      color: var(--text-dim);
      min-width: 2.2rem;
      text-align: center;
    }

    /* SAN inline bar */
    .san-cell {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 140px;
    }
    .san-track {
      flex: 1;
      height: 6px;
      background: var(--overlay-track);
      border-radius: 3px;
      overflow: hidden;
    }
    .san-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
      background-image: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0));
    }
    .san-num {
      font-family: var(--mono);
      font-weight: 600;
      font-size: 0.78rem;
      min-width: 2.6rem;
      text-align: right;
    }

    .status-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      white-space: nowrap;
      text-align: right;
    }
    .status-tag.OK { background: color-mix(in srgb, var(--green) 12%, transparent); color: var(--green); }
    .status-tag.WARNING { background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }
    .status-tag.DANGER { background: color-mix(in srgb, var(--rose) 14%, transparent); color: var(--rose); }
    /* Status now rides in the pal-name cell rather than its own column. */
    .pal-name-cell .status-tag { font-size: 0.62rem; padding: 0.1rem 0.35rem; }
    /* A cell whose value was deliberately suppressed, not missing. */
    .muted-cell { color: var(--text-faint); }

    .side-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .side-card-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      padding: 0.7rem 0.95rem;
      background: var(--surface-raised);
      border-bottom: 1px solid var(--border);
    }
    .side-card-body { padding: 0.5rem 0; }

    /* Player list */
    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.85rem;
      font-size: 0.82rem;
    }
    .player-row:hover { background: var(--overlay-soft); }
    .player-name {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .player-name .online-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--green);
      flex: none;
    }
    .player-name .online-dot.offline { background: var(--text-faint); }
    .player-meta {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-dim);
    }
    .player-row { flex-direction: column; align-items: stretch; gap: 0.15rem; }
    .player-row .player-sub {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-faint);
      font-family: var(--mono);
      padding-left: 0.85rem;
    }
    .player-row.offline .player-name { color: var(--text-dim); font-weight: 500; }

    /* Sick/low-SAN pals: one wrapping chip each rather than a full-width
       row each — at 25+ alerts the row layout was most of the tab's
       height for what is really just a list of names. */
    .alert-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      padding: 0.6rem 0.85rem 0.8rem;
    }
    .alert-chip {
      display: inline-flex;
      align-items: baseline;
      gap: 0.3rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
      white-space: nowrap;
    }
    .alert-chip.DANGER { background: color-mix(in srgb, var(--rose) 12%, transparent); color: var(--rose); }
    .alert-chip.WARNING { background: color-mix(in srgb, var(--amber) 12%, transparent); color: var(--amber); }
    .alert-chip .ac-base { font-family: var(--mono); font-size: 0.68rem; opacity: 0.7; }
    .alert-chip .ac-name { color: var(--text); font-weight: 600; }

    .empty-state {
      padding: 1rem 0.85rem;
      font-size: 0.8rem;
      color: var(--text-faint);
      text-align: center;
    }

    /* ─── Base Economy (facilities / storage / gaps) ─── */
    .econ-section {
      border-top: 1px solid var(--border);
      padding: 0.9rem 1.15rem 1rem;
    }
    /* Two narrow sections (产出速率 / 电力) share one row on a desktop
       instead of each running the full width for a six-character label and
       a four-digit number. They stack again below 900px. */
    .econ-row { display: grid; grid-template-columns: 1fr; }
    @media (min-width: 900px) {
      .econ-row { grid-template-columns: 1fr 1fr; }
      .econ-row > .econ-section + .econ-section { border-left: 1px solid var(--border); }
    }
    /* Section titles inside a base panel. Uppercase + letter-spacing (the
       usual small-caps label treatment) does nothing to Latin-free text
       except space it out, so these are sized and coloured up instead —
       they were the same weight as the data they introduce. */
    .econ-heading {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    /* A short colour rail in the base's own colour, so section titles line
       up down the left edge of the panel and read as one family. */
    .econ-heading::before {
      content: '';
      flex: none;
      width: 3px;
      height: 0.95em;
      border-radius: 2px;
      background: var(--base-color, var(--cyan));
    }
    /* space-between put a heading's own subtitle (共 35 座, 每小时) in the
       middle of an empty row, detached from the title it belongs to. The
       control is the only thing that goes to the right edge. */
    .econ-heading .econ-toggle-btn { margin-left: auto; }
    .facility-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .collapsible.collapsed { display: none; }
    .facility-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.72rem;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      background: var(--overlay-hover);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .facility-chip b { color: var(--text); font-family: var(--mono); }
    .facility-chip.highlight {
      background: color-mix(in srgb, var(--base-color, var(--cyan)) 10%, transparent);
      border-color: color-mix(in srgb, var(--base-color, var(--cyan)) 28%, transparent);
      color: var(--base-color, var(--cyan));
    }
    .facility-chip.highlight b { color: var(--base-color, var(--cyan)); }

    /* 据点物资 holds two different kinds of thing — what the base pulls
       out of the ground and what it makes from that — and as two bare
       lists under two small captions they read as one long run of items.
       Each is its own bordered block with its own accent colour, so the
       boundary is a wall rather than a line of small text. */
    .res-group {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
    }
    .res-group + .res-group { margin-top: 0.7rem; }
    .res-group.raw { --tone: var(--amber); }
    .res-group.proc { --tone: var(--indigo); }
    .res-group-head {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.7rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      border-left: 3px solid var(--tone);
      background: linear-gradient(90deg,
        color-mix(in srgb, var(--tone) 13%, transparent),
        color-mix(in srgb, var(--tone) 2%, transparent) 55%,
        transparent);
    }
    .res-group-icon { font-size: 0.9rem; line-height: 1; }
    .res-group-title { color: var(--tone); }
    .res-group-sub {
      font-size: 0.68rem;
      font-weight: 400;
      color: var(--text-faint);
    }
    .res-group-count {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.7rem;
      color: var(--tone);
      background: color-mix(in srgb, var(--tone) 12%, transparent);
      border-radius: 999px;
      padding: 0.05rem 0.45rem;
    }
    .res-group-head .econ-toggle-btn { margin-left: auto; }

    /* Separators are drawn by the tiles themselves, not by a gap letting a
       darker container background through: the last row is rarely full, and
       a container-drawn grid painted the leftover cells as a grey slab. The
       negative margins tuck the trailing column/row lines under the group's
       own border instead of doubling it. */
    .resource-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(152px, 1fr));
      margin: 0 -1px -1px 0;
    }
    /* One tile per item: name, count, and a bar showing the count against
       the biggest stock in this group. The bar is what makes a wall of
       numbers scannable — "what do I have a lot of" is answered by shape
       before any digit is read. Tiles are separated by the grid's 1px
       background showing through, so no two items can visually merge. */
    .res-tile {
      background: var(--surface);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 0.45rem 0.6rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }
    .res-tile:hover { background: var(--overlay-soft); }
    .res-tile-top {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      min-width: 0;
    }
    .res-ico { font-size: 0.75rem; flex: none; line-height: 1; }
    .resource-name {
      color: var(--text-dim);
      font-size: 0.75rem;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .res-tile-num { display: flex; align-items: baseline; gap: 0.35rem; }
    .resource-count {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .resource-pending {
      font-family: var(--mono);
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--amber);
      background: color-mix(in srgb, var(--amber) 12%, transparent);
      border-radius: 4px;
      padding: 0 0.25rem;
      white-space: nowrap;
    }
    .res-bar {
      height: 3px;
      border-radius: 2px;
      background: var(--overlay-track);
      overflow: hidden;
    }
    .res-bar i {
      display: block;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg,
        color-mix(in srgb, var(--tone) 45%, transparent), var(--tone));
    }

    .gap-window { color: var(--text-faint); font-size: 0.68rem; font-family: var(--mono); }

    #idle-content { padding: 0.55rem 0.85rem 0.75rem; }

    .proposal-base-heading {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 0.9rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border-hover);
    }
    .proposal-base-heading:first-child { margin-top: 0; }
    .base-collapse-arrow {
      display: inline-block;
      font-size: 0.65rem;
      color: var(--text-faint);
      transition: transform 0.15s;
    }
    .base-collapse-arrow.collapsed { transform: rotate(-90deg); }
    .proposal-subheading {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-dim);
      margin-top: 0.5rem;
      padding-top: 0.5rem;
    }
    /* Capped: these are 3-4 short columns, and at full page width the
       status ended up an inch from the facility it describes. */
    .proposal-table { width: 100%; max-width: 880px; border-collapse: collapse; }
    .proposal-table th {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-faint);
      text-align: left;
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .proposal-table td {
      padding: 0.4rem 0.5rem;
      font-size: 0.78rem;
      color: var(--text-dim);
      border-bottom: 1px solid var(--overlay-hairline);
      white-space: nowrap;
    }
    .proposal-table tr:last-child td { border-bottom: none; }
    .proposal-table td:nth-child(1) { font-weight: 700; color: var(--text); }
    .proposal-table td:nth-child(2) { font-family: var(--mono); font-weight: 700; color: var(--rose); }
    .proposal-table td:nth-child(4) { color: var(--cyan); white-space: normal; }

    .rate-row { padding: 0.3rem 0 0.4rem; }
    .rate-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.82rem;
      padding-bottom: 0.25rem;
    }
    /* Same shape language as the resource tiles: the bar ranks the row
       against the fastest output at this base, so the ordering is visible
       before the numbers are read. */
    .rate-bar { --tone: var(--green); }
    .rate-name { color: var(--text); }
    .rate-val { font-family: var(--mono); font-weight: 700; color: var(--green); white-space: nowrap; }

    .suit-table { width: 100%; border-collapse: collapse; }
    .suit-table th {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-faint);
      text-align: right;
      padding: 0.3rem 0.5rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .suit-table th:first-child { text-align: left; }
    .suit-table td {
      padding: 0.3rem 0.5rem;
      font-size: 0.8rem;
      text-align: right;
      font-family: var(--mono);
      font-weight: 700;
      border-bottom: 1px solid var(--overlay-hairline);
    }
    .suit-table td:first-child {
      text-align: left;
      font-family: inherit;
      font-weight: 400;
      color: var(--text-dim);
    }
    .suit-table tr:last-child td { border-bottom: none; }
    .suit-table td.short { color: var(--rose); }
    .suit-table td.ok { color: var(--green); }
    .suit-table td.none { color: var(--text-faint); font-weight: 400; }

    .power-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .power-stat {
      position: relative;
      overflow: hidden;
      flex: 1;
      min-width: 150px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--base-color) 8%, transparent), transparent 60%),
        var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.7rem 0.5rem 0.8rem;
    }
    .power-stat::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--base-color);
      opacity: 0.7;
    }
    .power-stat-label {
      display: block;
      font-size: 0.68rem;
      color: var(--text-faint);
      margin-bottom: 0.15rem;
    }
    .power-stat-val {
      display: block;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.9rem;
    }
    .power-bar-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.4rem;
    }
    .power-bar-label {
      width: 4.5rem;
      flex: none;
      font-size: 0.72rem;
      color: var(--text-dim);
    }
    .power-bar-track {
      flex: 1;
      height: 10px;
      border-radius: 5px;
      background: var(--overlay-track);
      overflow: hidden;
      position: relative;
    }
    .power-bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.4s ease;
      background-image: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0));
    }
    .power-bar-nums {
      flex: none;
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 600;
      min-width: 5.5rem;
      text-align: right;
    }

    /* A unit or qualifier that belongs to the whole section, carried in
       its heading instead of repeated on every row below it. */
    .econ-unit {
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--text-faint);
      font-family: var(--mono);
    }

    .econ-toggle-btn {
      font-size: 0.68rem;
      color: var(--text-faint);
      cursor: pointer;
      user-select: none;
      background: none;
      border: none;
      font-family: inherit;
    }
    .econ-toggle-btn:hover { color: var(--text-dim); }

    /* Every header that opens and closes the block under it. The 展开/收起
       control stays put as the visible state label, but the whole row is
       the hit target — these are opened and closed constantly, and a
       six-character button is a small thing to keep aiming at. The control
       itself still works, so it stops the click from reaching the row and
       toggling twice. */
    .collapse-head { cursor: pointer; user-select: none; }
    .collapse-head:hover { background-color: var(--overlay-hover); }
    .collapse-head:hover .econ-toggle-btn { color: var(--text); }
    .collapse-head:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
    /* The side-card and 物资 headers are already padded boxes, so the hover
       tint has somewhere to sit. A section heading isn't: it's flush with
       the section's own padding. The negative margins give the tint a box
       that reaches the section edges while the paddings put the text and
       its colour rail back exactly where they were — so this heading still
       lines up with the ones above and below it. */
    .econ-heading.collapse-head {
      margin: -0.2rem -0.45rem 0.4rem;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
    }
    .resource-grid.truncated .res-tile:nth-child(n+13) { display: none; }

    /* ─── Crafting calculator ─── */
    .craft-source-note { font-size: 0.72rem; font-weight: 400; color: var(--text-faint); margin-left: 0.4rem; }
    .craft-controls {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.7rem 0.95rem;
      border-bottom: 1px solid var(--border);
    }
    .craft-ctl-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    .craft-ctl-label { font-size: 0.75rem; font-weight: 700; color: var(--text-dim); }
    .craft-base-chips, .craft-cats { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .craft-chip {
      appearance: none;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      white-space: nowrap;
    }
    .craft-chip:hover { border-color: var(--border-hover); color: var(--text); }
    .craft-chip.active {
      color: var(--cyan);
      border-color: var(--cyan);
      background: color-mix(in srgb, var(--cyan) 12%, transparent);
    }
    .craft-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      cursor: pointer;
      margin-left: auto;
    }
    .craft-search {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 0.82rem;
      padding: 0.4rem 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    .craft-search:focus { outline: none; border-color: var(--cyan); }

    .craft-body { display: grid; grid-template-columns: 1fr; }
    @media (min-width: 900px) {
      .craft-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
      .craft-list-wrap { border-right: 1px solid var(--border); }
    }
    .craft-list-head {
      font-size: 0.72rem;
      color: var(--text-faint);
      padding: 0.45rem 0.95rem 0.3rem;
    }
    .craft-list { max-height: 62vh; overflow-y: auto; }
    .craft-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      text-align: left;
      appearance: none;
      font: inherit;
      background: none;
      border: none;
      border-bottom: 1px solid var(--overlay-hairline);
      padding: 0.4rem 0.95rem;
      cursor: pointer;
    }
    .craft-row:hover { background: var(--overlay-soft); }
    .craft-row.active { background: color-mix(in srgb, var(--cyan) 10%, transparent); }
    .craft-row-name { flex: 1; min-width: 0; font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .craft-row-tag {
      font-size: 0.62rem;
      color: var(--text-faint);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 0.25rem;
      flex: none;
    }
    /* How many the current stock can make — the answer the list is for, so
       it carries the colour: green when something can be made, dim when not. */
    .craft-row-can {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--green);
      flex: none;
    }
    .craft-row-can.zero { color: var(--text-faint); font-weight: 400; }

    .craft-detail { padding: 0.85rem 0.95rem 1rem; }
    .craft-title { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .craft-sub { font-size: 0.72rem; color: var(--text-faint); font-family: var(--mono); margin-top: 0.2rem; }
    .craft-max {
      margin: 0.7rem 0;
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, var(--green) 25%, var(--border));
      background: color-mix(in srgb, var(--green) 8%, transparent);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--green);
    }
    .craft-max.zero {
      border-color: color-mix(in srgb, var(--rose) 25%, var(--border));
      background: color-mix(in srgb, var(--rose) 8%, transparent);
      color: var(--rose);
    }
    .craft-max b { font-family: var(--mono); font-size: 1.1rem; }
    /* The caveat under a combined-stock figure — same box, quieter voice. */
    .craft-split {
      display: block;
      margin-top: 0.25rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--amber);
    }
    /* Recipe variants for one product — same chip vocabulary as the filters,
       with what each variant can currently make. */
    .craft-variants {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.55rem;
    }
    .craft-qty { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
    .craft-qty-label { font-size: 0.75rem; color: var(--text-dim); font-weight: 700; }
    .craft-qty input {
      width: 5.5rem;
      font: inherit;
      font-family: var(--mono);
      font-size: 0.85rem;
      padding: 0.3rem 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    .craft-mat-table { width: 100%; border-collapse: collapse; }
    .craft-mat-table th {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-dim);
      text-align: right;
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .craft-mat-table th:first-child { text-align: left; }
    .craft-mat-table td {
      font-size: 0.82rem;
      padding: 0.35rem 0.5rem;
      text-align: right;
      font-family: var(--mono);
      border-bottom: 1px solid var(--overlay-hairline);
    }
    .craft-mat-table td:first-child { text-align: left; font-family: var(--sans); }
    /* The material cell now carries several wrapped lines under the name, so
       the numeric columns have to be told not to wrap their own headers. */
    .craft-mat-table th:not(:first-child), .craft-mat-table td:not(:first-child) { white-space: nowrap; }
    .craft-mat-table tr:last-child td { border-bottom: none; }
    .craft-mat-table td.short { color: var(--rose); font-weight: 700; }
    .craft-mat-table td.ok { color: var(--green); }
    /* Where a material is, under its name: one chip per base holding any,
       in that base's own colour. A base that isn't part of the selected
       stock source is outlined instead of filled — it counts as "exists,
       but not here". */
    .craft-where { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.2rem; }
    .cw-chip {
      font-family: var(--sans);
      font-size: 0.66rem;
      font-weight: 700;
      white-space: nowrap;
      padding: 0.05rem 0.4rem;
      border-radius: 999px;
      color: var(--c);
      background: color-mix(in srgb, var(--c) 13%, transparent);
      border: 1px solid transparent;
    }
    .cw-chip.other {
      background: none;
      border-color: color-mix(in srgb, var(--c) 40%, transparent);
      color: color-mix(in srgb, var(--c) 75%, var(--text-faint));
    }
    .cw-none { font-family: var(--sans); font-size: 0.66rem; color: var(--text-faint); }

    .craft-buy {
      display: block;
      margin-top: 0.2rem;
      font-family: var(--sans);
      font-size: 0.72rem;
      line-height: 1.5;
      color: var(--amber);
    }

    .craft-subrecipe {
      font-size: 0.72rem;
      color: var(--cyan);
      font-family: var(--sans);
      display: block;
      margin-top: 0.15rem;
    }
    .craft-note {
      margin-top: 0.7rem;
      font-size: 0.72rem;
      color: var(--text-faint);
      line-height: 1.6;
    }
    .craft-warn { color: var(--amber); }

    /* ─── Info Footer ─── */
    .info-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.72rem;
      color: var(--text-faint);
      padding-top: 0.25rem;
    }
    .info-footer a {
      color: var(--text-dim);
      text-decoration: none;
    }

    /* ─── Responsive ─── */
    @media (max-width: 600px) {
      .shell { padding: 0.75rem; }
      .stats-strip { grid-template-columns: repeat(2, 1fr); }
      .stat-value { font-size: 1.1rem; }
      .san-cell { min-width: 100px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-left">
        <h1>🏰 据点监控</h1>
        <span class="server-pill" id="server-status">
          <span class="dot"></span>
          <span id="server-status-text">连接中…</span>
        </span>
        <span class="server-uptime" id="server-uptime"></span>
        <span class="stale-badge" id="stale-badge" style="display:none"></span>
        <span class="stale-badge fetch-fail" id="fetch-badge" style="display:none"></span>
      </div>
      <div class="topbar-right-group">
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="切换深色/浅色">🌙</button>
        <div class="topbar-right" id="update-time">--:--:--</div>
      </div>
    </div>

    <!-- Stats Strip -->
    <div class="stats-strip">
      <div class="stat-cell" style="--accent:var(--cyan)">
        <div class="stat-label">内存</div>
        <div class="stat-value" id="s-mem" style="color:var(--cyan)">--</div>
        <div class="stat-sub" id="s-mem-detail">PalSrv --</div>
      </div>
      <div class="stat-cell" style="--accent:var(--green)">
        <div class="stat-label">在线</div>
        <div class="stat-value" id="s-players" style="color:var(--green)">--</div>
        <div class="stat-sub" id="s-players-max">/ --</div>
      </div>
      <div class="stat-cell" style="--accent:var(--indigo)">
        <div class="stat-label">游戏天</div>
        <div class="stat-value" id="s-days" style="color:var(--indigo)">--</div>
        <div class="stat-sub" id="s-uptime">--</div>
      </div>
      <div class="stat-cell" style="--accent:var(--text-dim)">
        <div class="stat-label">据点帕鲁</div>
        <div class="stat-value" id="s-base-pals">--</div>
        <div class="stat-sub" id="s-total-pals">全服 --</div>
      </div>
      <div class="stat-cell" style="--accent:var(--rose)">
        <div class="stat-label">⚠ 警报</div>
        <div class="stat-value" id="s-alerts" style="color:var(--text-faint)">0</div>
        <div class="stat-sub" id="s-alert-detail">全部健康</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="alerts" onclick="switchTab('alerts')">⚠ 警报<span class="tab-badge" id="tab-alert-badge" style="display:none">0</span></button>
      <button class="tab-btn" data-tab="bases" onclick="switchTab('bases')">🏕 据点详情</button>
      <button class="tab-btn" data-tab="craft" onclick="switchTab('craft')">🔨 制造计算</button>
      <button class="tab-btn" data-tab="server" onclick="switchTab('server')">📡 服务器监控</button>
    </div>

    <!-- ══ Alerts Tab ══ -->
    <div class="tab-panel active" id="tab-alerts">

    <!-- 异常帕鲁 on top: it's the shortest card (a single wrapped row of
         chips) and the most urgent. 长期空闲统计 below it is several
         screens tall on a busy save, so it goes second. -->
    <div class="side-card" id="alert-pals-card">
      <div class="side-card-header">🔔 异常帕鲁</div>
      <div id="alert-list"><div class="empty-state">全部帕鲁状态正常</div></div>
    </div>

    <div class="side-card" id="idle-card">
      <div class="side-card-header collapse-head" role="button" tabindex="0" data-keyactivate onclick="toggleCollapse('idle-content','idle-toggle')">
        ⏳ 长期空闲统计
        <button class="econ-toggle-btn" id="idle-toggle" onclick="event.stopPropagation(); toggleCollapse('idle-content','idle-toggle')">收起</button>
      </div>
      <div class="collapsible" id="idle-content"><div class="empty-state">数据采集中…</div></div>
    </div>

    </div>
    <!-- ══ /Alerts Tab ══ -->

    <!-- ══ Server Monitoring Tab ══ -->
    <div class="tab-panel" id="tab-server">

    <!-- Memory & Players Chart -->
    <div class="side-card" id="mem-chart-card">
      <div class="side-card-header collapse-head" role="button" tabindex="0" data-keyactivate onclick="toggleCollapse('mem-chart-body','mem-chart-toggle')">
        📈 内存 & 在线人数趋势
        <button class="econ-toggle-btn" id="mem-chart-toggle" onclick="event.stopPropagation(); toggleCollapse('mem-chart-body','mem-chart-toggle')">收起</button>
      </div>
      <div class="collapsible" id="mem-chart-body">
        <!-- The legend is also the series picker: clicking an entry drops
             that line from the chart. Rescaling follows (the players axis
             and the % axis each disappear with their own series), so
             switching off a series actually gives the others the space. -->
        <div class="chart-legend">
          <button class="legend-item" id="lg-item-sys_pct" title="点击显示 / 隐藏这条曲线" onclick="toggleSeries('sys_pct')"><i class="legend-dot" style="background:var(--cyan)"></i>系统内存 <b id="lg-sys">--%</b></button>
          <button class="legend-item" id="lg-item-palserver_mb" title="点击显示 / 隐藏这条曲线" onclick="toggleSeries('palserver_mb')"><i class="legend-dot" style="background:var(--indigo)"></i>PalServer <b id="lg-pal">--MB</b></button>
          <button class="legend-item" id="lg-item-online_players" title="点击显示 / 隐藏这条曲线" onclick="toggleSeries('online_players')"><i class="legend-dot" style="background:var(--green)"></i>在线人数 <b id="lg-players">--</b></button>
        </div>
        <div class="chart-meta">
          <span id="mem-chart-span">左轴为占系统内存的真实百分比，右轴为在线人数</span>
          <span id="mem-chart-points">-- 个采样点</span>
        </div>
        <div class="chart-wrap">
          <svg id="mem-chart-svg" class="chart-svg" viewBox="0 0 1000 220"></svg>
          <div class="chart-tooltip" id="mem-tooltip">
            <span class="mt-time"></span>
            <span class="mt-val" id="mt-sys" style="color:var(--cyan)"></span>
            <span class="mt-val" id="mt-pal" style="color:var(--indigo)"></span>
            <span class="mt-val" id="mt-players" style="color:var(--green)"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Online Players -->
    <div class="side-card" id="player-card">
      <div class="side-card-header">👥 玩家</div>
      <div class="side-card-body" id="player-list">
        <div class="empty-state">暂无玩家在线</div>
      </div>
    </div>

    <!-- Server Info -->
    <div class="side-card" id="server-info-card">
      <div class="side-card-header">📡 服务器</div>
      <div class="side-card-body" style="padding: 0.5rem 0.85rem;">
        <div style="font-size:0.8rem; color:var(--text-dim); display:flex; flex-direction:column; gap:0.3rem;" id="server-info">
          <span>—</span>
        </div>
      </div>
    </div>

    </div>
    <!-- ══ /Server Monitoring Tab ══ -->

    <!-- ══ Base Details Tab ══ -->
    <div class="tab-panel" id="tab-bases">
      <!-- One tab + one .base-panel per base, both built by
           syncBasePanels() from status.json's own "bases" list — the
           backend enumerates every camp the guild owns, so a base built
           in-game appears here without this markup being copied a third
           time. Only the selected base's panel is displayed; all of them
           stay in the DOM and keep being rendered on every poll, so
           switching tabs never shows stale data or waits for a fetch. -->
      <div class="base-tab-nav" id="base-tab-nav"></div>
      <div class="bases-col" id="bases-col"></div>
    </div>
    <!-- ══ /Base Details Tab ══ -->

    <!-- ══ Crafting Calculator Tab ══ -->
    <div class="tab-panel" id="tab-craft">
      <div class="side-card">
        <div class="side-card-header">🔨 制造计算 <span class="craft-source-note" id="craft-source-note"></span></div>
        <div class="craft-controls">
          <div class="craft-ctl-row">
            <span class="craft-ctl-label">库存来源</span>
            <div class="craft-base-chips" id="craft-base-chips"></div>
            <label class="craft-toggle"><input type="checkbox" id="craft-pending" onchange="setCraftPending(this.checked)"> 计入待收集</label>
          </div>
          <div class="craft-ctl-row">
            <input class="craft-search" id="craft-search" type="search" placeholder="搜索配方（中文名或内部 ID）…" oninput="setCraftQuery(this.value)">
          </div>
          <div class="craft-cats" id="craft-cats"></div>
        </div>
        <div class="craft-body">
          <div class="craft-list-wrap">
            <div class="craft-list-head" id="craft-list-head"></div>
            <div class="craft-list" id="craft-list"><div class="empty-state">配方载入中…</div></div>
          </div>
          <div class="craft-detail" id="craft-detail"><div class="empty-state">从左侧选择一个配方</div></div>
        </div>
      </div>
    </div>
    <!-- ══ /Crafting Calculator Tab ══ -->

    <!-- Footer -->
    <div class="info-footer">
      <span>数据来源: Level.sav 实时解析 + REST API</span>
      <span>每 60 秒自动刷新（后端每 5 分钟另有定时采集）</span>
    </div>
  </div>

  <script>
    function sanColor(val) {
      if (val < 30) return 'var(--rose)';
      if (val < 60) return 'var(--amber)';
      return 'var(--green)';
    }

    // ─── Persisted UI state ───
    // Every collapse/expand and filter choice on the page lands here and is
    // written to localStorage, so a reload doesn't silently re-collapse the
    // three sections you had open. Keys are prefixed by control kind
    // ('c'=collapsible, 'r'=resource grid, 'a'=active base tab, 'f'=pal
    // filter, 'g'=idle-panel base group) so one flat object covers all of them.
    const UI_STATE_KEY = 'palDashboardUi';
    let uiState = {};
    try { uiState = JSON.parse(localStorage.getItem(UI_STATE_KEY)) || {}; } catch (e) { uiState = {}; }
    function saveUiState() {
      try { localStorage.setItem(UI_STATE_KEY, JSON.stringify(uiState)); } catch (e) {}
    }

    // The pal list has exactly ONE filter, held here: 'ALL', 'ABNORMAL',
    // or a work-suitability key. It used to be two independent controls —
    // a 展开全部/收起 button (hide status_code === 'OK' pals) plus a
    // separate suitability filter — and they contradicted each other: with
    // 收起 active, the "全部" chip still hid healthy pals, so a healthy pal
    // could appear under 采矿 而 not under 全部 and read as fabricated data.
    // Defaults to ALL: with ABNORMAL as the default, a base where nothing
    // is wrong opened to an empty table — hiding the matrix, which is the
    // part you actually came to read — and the 仅异常 chip is right there.
    // Keyed by panel prefix ('b1', 'b2', ...); syncBasePanels seeds an
    // entry for each base it builds, so this doesn't need to know how
    // many there are.
    const palFilter = {};


    function setPalFilter(prefix, suit) {
      palFilter[prefix] = suit;
      uiState[`f:${prefix}`] = suit;
      saveUiState();
      if (!lastData) return;
      const b = BASES.find(x => x.prefix === prefix);
      if (!b) return;
      renderPalFilter(`${prefix}-pal-filter`, prefix, lastData[`${b.key}_pals`], lastData[`${b.key}_facilities`]);
      renderPalTable(`${prefix}-pal-table`, lastData[`${b.key}_pals`], lastData[`${b.key}_facilities`], palFilter[prefix]);
    }

    // Which work-suitability columns this base's matrix needs, plus the
    // two footer rows' numbers:
    //   supply = how many pals here have that suitability at all (rank>0),
    //            headcount not rank-sum — "can this job get covered".
    //   demand = how many placed facilities need it (a facility needing
    //            two types, e.g. a farm plot needing Seeding + Watering,
    //            counts toward both).
    // Ordered by demand desc so the jobs this base actually has to staff
    // sit leftmost. Same numbers the standalone 工作适应性 table used to
    // show; it's now the footer of this matrix instead of its own section.
    function baseSuitColumns(pals, facilities) {
      const demand = {};
      for (const [fid, count] of Object.entries(facilities || {})) {
        for (const suit of FACILITY_SUITABILITY[fid] || []) {
          demand[suit] = (demand[suit] || 0) + count;
        }
      }
      const supply = {};
      for (const p of pals || []) {
        const ws = palWorkSuitability(p.type);
        if (!ws) continue;
        for (const [s, r] of Object.entries(ws)) {
          if (r > 0) supply[s] = (supply[s] || 0) + 1;
        }
      }
      const types = [...new Set([...Object.keys(demand), ...Object.keys(supply)])];
      types.sort((a, b) => (demand[b] || 0) - (demand[a] || 0) || (supply[b] || 0) - (supply[a] || 0));
      return { types, demand, supply };
    }

    // Which of this base's placed facilities each suitability staffs —
    // the inverse of FACILITY_SUITABILITY, restricted to what's actually
    // built here so a chip names facilities you really have rather than
    // every facility in the game that could use that suitability.
    function suitabilityFacilities(facilities) {
      const map = {};
      for (const [fid, count] of Object.entries(facilities || {})) {
        if (!count) continue;
        for (const suit of FACILITY_SUITABILITY[fid] || []) {
          (map[suit] = map[suit] || []).push(fid);
        }
      }
      return map;
    }

    function renderPalFilter(elId, base, pals, facilities) {
      const el = document.getElementById(elId);
      const facMap = suitabilityFacilities(facilities);
      const { types, supply } = baseSuitColumns(pals, facilities);
      const active = palFilter[base];
      const abnormal = (pals || []).filter(p => p.status_code !== 'OK').length;

      // The facility list stays in the tooltip and out of the chip body.
      // Inline it ran three or four wrapped rows of ellipsised names above
      // every roster — more chrome than the table it was filtering.
      const chip = (key, label, count, facLabel) =>
        `<button class="pal-filter-chip ${active === key ? 'active' : ''}" onclick="setPalFilter('${base}','${key}')"${facLabel ? ` title="对应设施：${facLabel}"` : ''}>
          <span>${label}</span>
          <span class="pfc-count">${count}</span>
        </button>`;

      const suitChips = types.map(t =>
        chip(t, suitabilityName(t), supply[t] || 0, (facMap[t] || []).map(facilityName).join('/'))
      ).join('');

      el.innerHTML = chip('ALL', '全部', (pals || []).length)
        + chip('ABNORMAL', '仅异常', abnormal)
        + suitChips;
    }

    // Pal roster and work-suitability coverage as one matrix — a row per
    // pal, a column per suitability, and the per-column 具备/需求 totals as
    // footer rows (what the standalone 工作适应性 section used to show).
    // Keeping them apart meant reading the same numbers twice in two
    // different shapes; together, "who can do this and is it enough" is
    // one glance down a column.
    function renderPalTable(containerId, pals, facilities, filter) {
      const el = document.getElementById(containerId);
      if (!pals || pals.length === 0) {
        el.innerHTML = '<div class="empty-state">暂无数据</div>';
        return;
      }
      const { types, demand, supply } = baseSuitColumns(pals, facilities);
      const list = filter === 'ALL' ? pals
        : filter === 'ABNORMAL' ? pals.filter(p => p.status_code !== 'OK')
        : pals.filter(p => ((palWorkSuitability(p.type) || {})[filter] || 0) > 0);

      // 状态 rides along under the pal's name instead of getting its own
      // trailing column: with two base panels side by side on a desktop the
      // matrix is already wider than a panel, and the rightmost column was
      // the one that got clipped by the horizontal scroll — i.e. exactly the
      // one you most want to see without scrolling.
      const head = `<tr>
        <th>帕鲁</th><th>Lv</th><th>SAN</th>
        ${types.map(t => `<th class="ws-col ${t === filter ? 'hl' : ''}">${suitabilityName(t)}</th>`).join('')}
        <th>岗位</th>
      </tr>`;

      let body;
      if (list.length === 0) {
        const msg = filter === 'ABNORMAL'
          ? `${pals.length} 只帕鲁状态均正常`
          : `没有具备「${suitabilityName(filter)}」的帕鲁`;
        body = `<tr><td colspan="${types.length + 4}" class="empty-state">${msg}</td></tr>`;
      } else {
        body = list.map(p => {
          const color = sanColor(p.san);
          const species = palName(p.type);
          // Species name only needs its own line when it differs from what's
          // already shown — i.e. when the player gave the pal a nickname.
          const nameHtml = (p.name
            ? `${p.name}<span class="pal-type">${species}</span>`
            : species)
            + (p.status_code === 'OK' ? '' : `<span class="status-tag ${p.status_code}">${p.status}</span>`);
          const ws = palWorkSuitability(p.type) || {};
          const cells = types.map(t => {
            const r = ws[t] || 0;
            return `<td class="ws-col ${t === filter ? 'hl' : ''} ${r ? '' : 'zero'}">${r || '·'}</td>`;
          }).join('');
          // 🔒 marks a job the player locked the pal to (won't wander off to
          // other work on its own). Work ratio is "% of observed history
          // this pal has had *some* job" — shown even when currently idle,
          // since that's a separate, longer-run signal from the instant
          // snapshot of whether it's working right this moment.
          const jobLabel = p.job
            ? `${p.job_fixed ? '🔒 ' : ''}${facilityName(p.job)}`
            : '<span style="color:var(--text-faint)">空闲</span>';
          // Only shown once there is one. The "still collecting" case used
          // to print a second line under every single row, which doubled
          // the height of the whole table to say the same thing 15 times.
          const ratioLabel = p.work_ratio != null
            ? `<span class="job-ratio">工作占比 ${Math.round(p.work_ratio * 100)}%</span>`
            : '';
          return `<tr>
            <td><div class="pal-name-cell">${nameHtml}</div></td>
            <td><span class="lv-badge">${p.level || '?'}</span></td>
            <td>
              <div class="san-cell">
                <div class="san-track"><div class="san-fill" style="width:${Math.min(100, p.san)}%;background-color:${color}"></div></div>
                <span class="san-num" style="color:${color}">${p.san}</span>
              </div>
            </td>
            ${cells}
            <td><div class="job-cell">${jobLabel}${ratioLabel}</div></td>
          </tr>`;
        }).join('');
      }

      // Totals always cover the whole base, never just the filtered rows —
      // "does this base have enough Mining pals" doesn't change because
      // you're currently looking at only the sick ones.
      // Both footer rows print zero the same way — a dimmed 0, never a '·'
      // in one row and a 0 in the other. The asymmetry made "nobody here can
      // do this" and "nothing here needs it" look like different kinds of
      // value when they're both just zero.
      const sumCell = (t, v, short) =>
        `<td class="ws-col ${t === filter ? 'hl' : ''} ${short ? 'short' : ''} ${v ? '' : 'zero'}">${v}</td>`;
      const foot = `
        <tr class="sum-row">
          <td colspan="3">具备（本据点全部 ${pals.length} 只）</td>
          ${types.map(t => sumCell(t, supply[t] || 0, (demand[t] || 0) > 0 && (supply[t] || 0) < demand[t])).join('')}
          <td></td>
        </tr>
        <tr class="sum-row">
          <td colspan="3">实际需求（设施数）</td>
          ${types.map(t => sumCell(t, demand[t] || 0, (demand[t] || 0) > 0 && (supply[t] || 0) < demand[t])).join('')}
          <td></td>
        </tr>`;

      el.innerHTML = `<table class="pal-table pal-matrix">
        <thead>${head}</thead>
        <tbody>${body}</tbody>
        <tfoot>${foot}</tfoot>
      </table>`;
      syncPalHeadPin(el);
    }

    // Pin the roster header to the top of the page, but only while the
    // matrix fits its panel — see .pal-table-wrap.pinned-head for why the
    // two can't both be true.
    function syncPalHeadPin(wrap) {
      const table = wrap.querySelector('table');
      // A base panel that isn't the selected one is display:none and
      // measures zero; the observer re-runs this when it gets a size.
      if (!table || !wrap.clientWidth) return;
      // Measure the *table*, not the wrapper's scrollWidth: the table is
      // width:max-content/min-width:100%, so it reads the same whether or
      // not the wrapper is currently a scroll container. scrollWidth changes
      // meaning as the class toggles, which makes the toggle oscillate.
      wrap.classList.toggle('pinned-head', table.offsetWidth <= wrap.clientWidth);
    }
    // The answer changes on a re-render, on a resize, and whenever a panel
    // that was display:none comes on screen — so the two switchers call this
    // too. (A ResizeObserver looks like the tidier way to catch all three,
    // but its notifications are tied to frame production, and the ones for
    // a panel going from display:none to visible do not reliably arrive.)
    function syncPalHeadPins() {
      document.querySelectorAll('.pal-table-wrap').forEach(syncPalHeadPin);
    }
    window.addEventListener('resize', syncPalHeadPins);

    // Every player who has ever joined, not just who's online right now —
    // an offline player shows when they were last seen (from their own
    // save file's LastOnlineDateTime) instead of just disappearing from
    // the list. There used to be a "战力" number alongside that; it was the
    // Expeditions firepower formula, which is dominated by a (stars+1)^2
    // condensation term and so ranked a level-1 condensed pal above a
    // level-80 one. The stats behind it are no longer computed at all.
    function renderPlayers(players) {
      const el = document.getElementById('player-list');
      if (!players || players.length === 0) {
        el.innerHTML = '<div class="empty-state">暂无玩家数据</div>';
        return;
      }
      el.innerHTML = players.map(p => {
        // "最后登录", not "最后在线": this comes from each player save's
        // LastOnlineDateTime, and checking it against a session whose real
        // end time was known (logged off around midnight, field said 15:46
        // the same day) showed it tracks when the session *started*.
        // Calling it 最后在线 made a correct reading look like a bug.
        const statusLabel = p.online ? '在线' : (p.last_online ? `最后登录 ${p.last_online.slice(5, 16)}` : '离线');
        return `<div class="player-row ${p.online ? '' : 'offline'}">
          <span class="player-name"><span class="online-dot ${p.online ? '' : 'offline'}"></span>${p.name}<span class="player-meta">Lv.${p.level}</span></span>
          <span class="player-sub">
            <span>${statusLabel}</span>
          </span>
        </div>`;
      }).join('');
    }

    // Sick or low-SAN pals across every base, sorted danger-first. The
    // per-pal detail (SAN bar, job, level) already lives in each base's
    // own pal table — this is only the "which ones need attention"
    // shortlist, so it stays to one compact chip per pal. The chip's base
    // tag drops the "据点" suffix off the panel label to stay one chip
    // wide ("1号据点" -> "1号").
    function renderAlerts(d) {
      const el = document.getElementById('alert-list');
      const all = BASES.flatMap(b =>
        (d[`${b.key}_pals`] || []).map(p => ({ ...p, base: b.label.replace('据点', '') }))
      ).filter(p => p.status_code !== 'OK');

      if (all.length === 0) {
        el.innerHTML = '<div class="empty-state">全部帕鲁状态正常 ✓</div>';
        return;
      }
      all.sort((a, b) => (a.status_code === 'DANGER' ? 0 : 1) - (b.status_code === 'DANGER' ? 0 : 1));
      el.innerHTML = `<div class="alert-chips">${all.map(p => {
        const val = p.sick ? p.sick_name : `SAN ${p.san}`;
        return `<span class="alert-chip ${p.status_code}">
          <span class="ac-base">${p.base}</span><span class="ac-name">${p.name || palName(p.type)}</span>${val}
        </span>`;
      }).join('')}</div>`;
    }

    // ─── Memory + online-players chart (SVG, hand-rolled: no chart lib available) ───
    // Two axes, both in real units — nothing here is normalized into a fake band
    // any more. The left axis is a genuine 0–100% of system RAM and carries two
    // series: sys_pct as reported, and PalServer's RSS converted to its own share
    // of total RAM, so the two can be read against each other and against the
    // gridlines directly. Online players is a head count, not a percentage, so
    // painting it on the % axis was what made 4 players sit on the 100% line —
    // it now has its own right-hand axis with whole-person ticks.
    const memChart = { history: [], sysTotalMb: 0 };
    const SERIES = [
      { key: 'sys_pct',        color: 'var(--cyan)',   legendId: 'lg-sys',     tipId: 'mt-sys' },
      { key: 'palserver_mb',   color: 'var(--indigo)', legendId: 'lg-pal',     tipId: 'mt-pal' },
      { key: 'online_players', color: 'var(--green)',  legendId: 'lg-players', tipId: 'mt-players' },
    ];

    // Which series are drawn. Remembered like every other panel state, so a
    // reader who only cares about PalServer's memory keeps that view across
    // reloads.
    const seriesOn = {};
    for (const s of SERIES) seriesOn[s.key] = uiState[`s:${s.key}`] !== false;

    function applySeriesToggles() {
      for (const s of SERIES) {
        const el = document.getElementById(`lg-item-${s.key}`);
        if (el) el.classList.toggle('off', !seriesOn[s.key]);
      }
    }

    function toggleSeries(key) {
      seriesOn[key] = !seriesOn[key];
      uiState[`s:${key}`] = seriesOn[key];
      saveUiState();
      applySeriesToggles();
      if (memChart.history.length) renderMemChart(memChart.history);
    }

    // PalServer RSS as a share of total system RAM. null while the status poll
    // hasn't reported a total yet (memChart.sysTotalMb is set in fetchData): the
    // total is a constant, so it rides on the status payload rather than being
    // repeated on all ~2000 history points.
    function palPct(mb) {
      if (!memChart.sysTotalMb) return null;
      return (Math.max(0, mb || 0) / memChart.sysTotalMb) * 100;
    }

    function renderMemChart(history) {
      const svg = document.getElementById('mem-chart-svg');
      const tooltip = document.getElementById('mem-tooltip');
      document.getElementById('mem-chart-points').textContent = `${history.length} 个采样点`;

      if (!history || history.length < 2) {
        svg.innerHTML = '<text x="500" y="110" text-anchor="middle" font-size="13" fill="var(--text-faint)">数据积累中…</text>';
        return;
      }

      memChart.history = history;

      const W = 1000, H = 220, PAD_L = 34, PAD_R = 40, PAD_T = 16, PAD_B = 22;
      const innerW = W - PAD_L - PAD_R, innerH = H - PAD_T - PAD_B;
      const n = history.length;
      const xAt = i => PAD_L + (innerW * i) / (n - 1);
      const yAtPct = pct => PAD_T + innerH * (1 - Math.min(100, Math.max(0, pct)) / 100);

      // Right axis top, rounded up to a multiple of 4 so all five gridlines land
      // on whole people rather than on 1.75 of a player.
      const playersSeen = Math.max(0, ...history.map(h => h.online_players || 0));
      const playersTop = Math.max(4, Math.ceil(playersSeen / 4) * 4);
      const yAtPlayers = v => yAtPct((Math.max(0, v || 0) / playersTop) * 100);

      // Two independent reasons a series isn't drawn: the reader switched it
      // off in the legend, or (PalServer only) there's no system total to
      // place it against yet — without one there is no honest position for
      // that line, so it's dropped rather than drawn on a made-up scale.
      // Both land here so nothing downstream has to know which it was.
      const hasPal = memChart.sysTotalMb > 0;
      const visible = SERIES.filter(s => seriesOn[s.key] && (s.key !== 'palserver_mb' || hasPal));
      const visibleKeys = new Set(visible.map(s => s.key));
      const anyPct = visibleKeys.has('sys_pct') || visibleKeys.has('palserver_mb');

      // Legend readings are the latest values, drawn or not — switching a
      // series off takes it off the chart, it doesn't stop reporting it.
      const last = history[n - 1];
      const lastPalPct = palPct(last.palserver_mb);
      document.getElementById('lg-sys').textContent = `${last.sys_pct ?? 0}%`;
      document.getElementById('lg-pal').textContent = lastPalPct === null
        ? `${last.palserver_mb ?? 0}MB`
        : `${last.palserver_mb ?? 0}MB (${lastPalPct.toFixed(1)}%)`;
      document.getElementById('lg-players').textContent = `${last.online_players ?? 0} 人`;

      // The axis note describes the axes that are actually on screen: with
      // the memory series switched off there is no left axis to explain, and
      // saying there is one is worse than saying nothing.
      const spanEl = document.getElementById('mem-chart-span');
      if (spanEl) {
        const axes = [];
        if (anyPct) axes.push('左轴为占系统内存的真实百分比');
        if (visibleKeys.has('online_players')) axes.push(`${anyPct ? '右轴' : '纵轴'}为在线人数`);
        spanEl.textContent = `${history[0].t} – ${history[n - 1].t}${axes.length ? ` · ${axes.join('，')}` : ''}`;
      }

      if (!visible.length) {
        svg.innerHTML = '<text x="500" y="110" text-anchor="middle" font-size="13" fill="var(--text-faint)">未选择曲线 — 点击上方图例开启</text>';
        return;
      }

      const yAt = (key, v) => {
        if (key === 'online_players') return yAtPlayers(v);
        if (key === 'palserver_mb') return yAtPct(palPct(v) || 0);
        return yAtPct(v);
      };

      // The % scale is labelled only while something sits on it, and the
      // people scale only while the players line is drawn — an axis with no
      // series left on it is just a column of numbers meaning nothing.
      let grid = '';
      [0, 25, 50, 75, 100].forEach(p => {
        const gy = yAtPct(p);
        grid += `<line x1="${PAD_L}" y1="${gy.toFixed(1)}" x2="${W - PAD_R}" y2="${gy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
        if (anyPct) {
          grid += `<text x="${PAD_L - 8}" y="${(gy + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-faint)" font-family="'JetBrains Mono',monospace">${p}%</text>`;
        }
        if (visibleKeys.has('online_players')) {
          grid += `<text x="${W - PAD_R + 8}" y="${(gy + 3.5).toFixed(1)}" text-anchor="start" font-size="10" fill="var(--green)" font-family="'JetBrains Mono',monospace" opacity="0.8">${Math.round((playersTop * p) / 100)}人</text>`;
        }
      });

      const seriesPts = {};
      visible.forEach(s => { seriesPts[s.key] = history.map((h, i) => [xAt(i), yAt(s.key, h[s.key])]); });

      const sysPts = seriesPts.sys_pct;
      const sysLinePath = sysPts
        ? sysPts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')
        : '';
      const areaPath = sysPts
        ? `${sysLinePath} L${sysPts[n - 1][0].toFixed(1)},${(PAD_T + innerH).toFixed(1)} L${sysPts[0][0].toFixed(1)},${(PAD_T + innerH).toFixed(1)} Z`
        : '';

      const otherLines = visible.filter(s => s.key !== 'sys_pct').map(s => {
        const pts = seriesPts[s.key];
        const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
        return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.85"/>`;
      }).join('');

      const xIdxs = [0, Math.floor((n - 1) / 2), n - 1];
      const xLabels = xIdxs.map(i => {
        const anchor = i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle');
        return `<text x="${xAt(i).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}" font-size="10" fill="var(--text-faint)" font-family="'JetBrains Mono',monospace">${history[i].t}</text>`;
      }).join('');

      const lastDots = visible.map(s => {
        const [lx, ly] = seriesPts[s.key][n - 1];
        return `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
      }).join('');

      svg.innerHTML = `
        <defs>
          <linearGradient id="memFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--cyan)" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="var(--cyan)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${grid}
        ${sysPts ? `<path d="${areaPath}" fill="url(#memFill)" stroke="none"/>` : ''}
        ${otherLines}
