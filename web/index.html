                x.b.label}${counted(x.b.key) ? '（已计入）' : '（未计入当前库存来源）'}">${x.b.icon} ${
                x.b.label.replace('据点', '')} ${x.n.toLocaleString()}</span>`).join('')}</span>`
          : '<span class="craft-where"><span class="cw-none">所有据点都没有</span></span>';
        // A shortage that another base could cover is a haulage job, not a
        // production problem, so it gets said outright.
        const elsewhere = spread.filter(x => !counted(x.b.key)).reduce((n, x) => n + x.n, 0);
        const haul = gap > 0 && elsewhere > 0
          ? `<span class="craft-subrecipe">缺 ${gap.toLocaleString()}，其他据点共有 ${elsewhere.toLocaleString()}${
              elsewhere >= gap ? '，调运即可补齐' : '，调运后仍差 ' + (gap - elsewhere).toLocaleString()}</span>`
          : '';
        let sub = '';
        if (gap > 0) {
          // One level deep only: "you're short 6 Cloth, and Cloth is itself
          // craftable from what you have" is useful; a full dependency tree
          // would be guessing at which base does which step.
          // Of the material's own recipes, the one current stock does best
          // with — Paldium Fragment has thirteen, and "crush stone" is only
          // the useful answer if there is stone.
          const subBest = bestSubRecipe(mid, inv);
          if (subBest) {
            const subRecipe = subBest.recipe;
            const per = subRecipe.materials.map(([sid, sc]) => `${itemName(sid)}×${sc}`).join(' + ');
            sub = `<span class="craft-subrecipe">可合成：${per} → ${subRecipe.count || 1} 个${
              subBest.yieldable ? `（现有材料可先做 ${subBest.yieldable.toLocaleString()} 个）` : '（其原料也不足）'}</span>`;
          }
        }
        return `<tr>
          <td>${itemName(mid)}${where}${haul}${sub}${gap > 0 ? merchantHint(mid) : ''}</td>
          <td>${want.toLocaleString()}</td>
          <td>${have.toLocaleString()}</td>
          <td class="${gap ? 'short' : 'ok'}">${gap ? `-${gap.toLocaleString()}` : '足够'}</td>
        </tr>`;
      }).join('');

      const notes = [];
      if (entry.kind === 'building') {
        notes.push('建筑配方来自游戏建筑数据表的建造材料，工作量为建造所需工作量。');
      }
      if (recipe.ambiguous) {
        notes.push(`<span class="craft-warn">⚠ 游戏里有 ${recipe.ambiguous.length + 1} 个物品共用这个名字（${
          [entry.id].concat(recipe.ambiguous).join(' / ')}），配方按最低阶那个归入，实际可能对应其他阶级。</span>`);
      }
      notes.push('库存只统计据点箱子里已入库的数量；玩家背包、帕鲁携带的物品都不在存档的据点库存里，因此不计入。');

      el.innerHTML = `
        <div class="craft-title">
          <span class="res-ico">${entry.kind === 'building' ? '🏗️' : itemIcon(entry.id)}</span>
          ${craftName(entry)}
          ${entry.kind === 'building' ? '<span class="craft-row-tag">建筑</span>' : ''}
        </div>
        <div class="craft-sub">${entry.id} · 每次产出 ${recipe.count} 个${recipe.work ? ` · 工作量 ${recipe.work.toLocaleString()}` : ''}</div>
        ${entry.kind === 'item' ? merchantHint(entry.id) : ''}
        ${entry.recipes.length > 1 ? `<div class="craft-variants">
          <span class="craft-qty-label">${entry.recipes.length} 种配方</span>
          ${entry.recipes.map((r, i) => {
            const label = r.materials.map(([sid, sc]) => `${itemName(sid)}×${sc}`).join('+');
            const yieldable = craftBatches(r, inv) * r.count;
            return `<button class="craft-chip ${i === vIdx ? 'active' : ''}" onclick="setCraftVariant(${i})" title="${label} → ${r.count} 个，现有材料可做 ${yieldable}">${label}${
              yieldable ? ` <span class="pfc-count">${yieldable.toLocaleString()}</span>` : ''}</button>`;
          }).join('')}
        </div>` : ''}
        <div class="craft-max ${maxItems ? '' : 'zero'}">
          ${maxItems ? `最多可做 <b>${maxItems.toLocaleString()}</b> 个（${maxBatches.toLocaleString()} 次制作）` : '当前材料不足，一个都做不了'}
          ${bestSingle && bestSingle.items < maxItems
            ? `<span class="craft-split">${bestSingle.items
                ? `材料分散在多个据点：单个据点最多 ${bestSingle.items.toLocaleString()} 个（${bestSingle.base.icon} ${bestSingle.base.label}），其余需调运`
                : '材料分散在多个据点，没有任何一个据点能独立完成，需先调运'}</span>`
            : ''}
        </div>
        <div class="craft-qty">
          <span class="craft-qty-label">想做</span>
          <input type="number" min="1" step="1" value="${target}" oninput="setCraftQty(this.value)">
          <span class="craft-qty-label">个 → 需制作 ${batches.toLocaleString()} 次</span>
          ${maxItems ? `<button class="craft-chip" onclick="setCraftQty(${maxItems})">按最大值</button>` : ''}
          <button class="craft-chip" onclick="setCraftQty(${recipe.count})">重置</button>
        </div>
        <table class="craft-mat-table">
          <thead><tr><th>材料</th><th>需要</th><th>库存</th><th>缺口</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="craft-note">${notes.join('<br>')}</div>
      `;
    }

    // "2026-08-15 04:30:00" → "04:30:00" if today (local date), else "08-15 04:30:00"
    function formatOfflineSince(str) {
      const [datePart, timePart] = str.split(' ');
      if (!timePart) return str;
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      if (datePart === todayStr) return timePart;
      return `${datePart.slice(5)} ${timePart}`;
    }

    // A poll that fails leaves every number on the page frozen at its last
    // value with no outward sign — the 更新时间 in the corner just stops
    // advancing, which is easy to miss. markFetchFailed puts that in the top
    // bar next to the stale-data badge instead.
    let lastFetchOk = null;
    function markFetchFailed(why) {
      const el = document.getElementById('fetch-badge');
      const since = lastFetchOk
        ? `，上次成功 ${lastFetchOk.toTimeString().slice(0, 8)}`
        : '';
      el.textContent = `⚠ 数据获取失败（${why}）${since}`;
      el.style.display = '';
    }

    // The page reads two documents, because its two halves move at
    // completely different speeds. status.json is the save: pals, stock,
    // facilities, trends — it can only change when the server rewrites
    // Level.sav, every few minutes, and producing it costs a ~3s parse.
    // live.json is the server talking about itself: online/offline, who is
    // logged in, uptime, the day count — it changes any second and costs a
    // REST call (~40ms). Fetching them together and overlaying the second
    // on the first is what lets this poll every minute without the parse.
    async function fetchLive() {
      try {
        const r = await fetch('live.json?t=' + Date.now());
        return r.ok ? await r.json() : null;
      } catch (e) {
        // The dashboard is still perfectly usable on status.json alone —
        // its server fields are just as old as the last parse.
        return null;
      }
    }

    function mergeLive(d, live) {
      if (!live) return d;
      const { online_uids, ...fields } = live;
      Object.assign(d, fields);
      const online = new Set(online_uids || []);
      for (const p of d.all_players || []) {
        // Older status.json documents (written before uid rode along) have
        // nothing to match on; leave their own flag alone rather than
        // marking everyone offline.
        if (p.uid) p.online = online.has(p.uid);
      }
      // Same order the backend writes: online first, then most recently
      // seen. Re-applied here because a login between two parses changes
      // who belongs at the top.
      (d.all_players || []).sort((a, b) => (b.last_online || '').localeCompare(a.last_online || ''));
      (d.all_players || []).sort((a, b) => (a.online ? 0 : 1) - (b.online ? 0 : 1));
      return d;
    }

    async function fetchData() {
      try {
        const [resp, live] = await Promise.all([
          fetch('status.json?t=' + Date.now()),
          fetchLive(),
        ]);
        if (!resp.ok) { markFetchFailed(`HTTP ${resp.status}`); return; }
        const d = mergeLive(await resp.json(), live);
        lastData = d;
        // Before anything renders: make sure there is a panel for every
        // base this poll reported (a no-op unless the set changed).
        syncBasePanels(d.bases);
        lastFetchOk = new Date();
        document.getElementById('fetch-badge').style.display = 'none';

        // Status pill
        const pill = document.getElementById('server-status');
        const pillText = document.getElementById('server-status-text');
        const uptimeEl = document.getElementById('server-uptime');
        if (d.server_online) {
          pill.classList.remove('offline');
          pillText.textContent = '在线';
          uptimeEl.textContent = d.uptime_display ? `运行 ${d.uptime_display}` : '';
        } else {
          pill.classList.add('offline');
          pillText.textContent = '离线';
          uptimeEl.textContent = d.offline_since ? `自 ${formatOfflineSince(d.offline_since)} 起离线` : '';
        }

        // Level.sav couldn't be parsed this update (see palmon/status.py's
        // _write_stale_status) — base panels below are the last successfully
        // parsed snapshot, not live, so this needs to be visible rather than
        // silently showing old numbers as if they were current.
        const staleBadge = document.getElementById('stale-badge');
        if (d.data_stale) {
          staleBadge.style.display = '';
          staleBadge.textContent = `⚠ 据点数据非实时（截至 ${d.data_stale_since || '?'}）`;
        } else {
          staleBadge.style.display = 'none';
        }

        // Stats
        const mem = d.memory || {};
        // The memory chart plots PalServer's RSS as a share of this total — it's
        // a constant, so it comes off the status poll instead of being repeated
        // on every history point. See renderMemChart.
        if (mem.system_total_gb) memChart.sysTotalMb = mem.system_total_gb * 1024;
        document.getElementById('s-mem').textContent = `${mem.system_pct || 0}%`;
        const palMem = mem.palserver_mb ? `PalSrv ${mem.palserver_mb}MB` : 'PalSrv 离线';
        document.getElementById('s-mem-detail').textContent = `${mem.system_used_gb || 0}/${mem.system_total_gb || 0}GB · ${palMem}`;
        document.getElementById('s-players').textContent = d.online_players || 0;
        document.getElementById('s-players-max').textContent = `/ ${d.max_players || 8}`;
        document.getElementById('s-days').textContent = d.game_days || '--';
        document.getElementById('s-uptime').textContent = d.uptime_display || '--';
        document.getElementById('s-base-pals').textContent = d.total_base_pals || 0;
        document.getElementById('s-total-pals').textContent = `全服 ${d.total_all_pals || '--'}`;

        // Alerts stat
        const totalAlerts = (d.warning_count || 0) + (d.danger_count || 0);
        const alertEl = document.getElementById('s-alerts');
        const alertDetail = document.getElementById('s-alert-detail');
        alertEl.textContent = totalAlerts;
        if (totalAlerts > 0) {
          alertEl.style.color = d.danger_count > 0 ? 'var(--rose)' : 'var(--amber)';
          const parts = [];
          if (d.danger_count) parts.push(`${d.danger_count} 危险`);
          if (d.warning_count) parts.push(`${d.warning_count} 疲惫`);
          alertDetail.textContent = parts.join(' · ');
        } else {
          alertEl.style.color = 'var(--text-faint)';
          alertDetail.textContent = '全部健康';
        }
        const tabBadge = document.getElementById('tab-alert-badge');
        if (totalAlerts > 0) {
          tabBadge.textContent = totalAlerts;
          tabBadge.style.display = '';
        } else {
          tabBadge.style.display = 'none';
        }

        // One pass per base, over whatever bases this poll reported —
        // syncBasePanels has already created any panel that's missing.
        for (const b of BASES) {
          const k = b.key, pre = b.prefix;
          const palCount = d[`total_${k}_count`] || 0;
          document.getElementById(`${pre}-count`).textContent = `${palCount} 只`;
          document.getElementById(`${pre}-tab-count`).textContent = palCount;
          const role = d[`${k}_role`] || {};
          const roleEl = document.getElementById(`${pre}-role`);
          roleEl.textContent = baseRoleLabel(role);
          roleEl.title = baseRoleDetail(role);
          // Amber only when a role the base is *headlined* for produced
          // nothing. A side activity going quiet (a single relic
          // converter, say) belongs in the tooltip, not in a colour that
          // says the base has stopped doing its job.
          const headlineStalled = (role.stalled || []).some(t => (role.tags || []).includes(t));
          roleEl.classList.toggle('stalled', headlineStalled);
          renderPalFilter(`${pre}-pal-filter`, pre, d[`${k}_pals`], d[`${k}_facilities`]);
          renderPalTable(`${pre}-pal-table`, d[`${k}_pals`], d[`${k}_facilities`], palFilter[pre]);
          renderFacilities(`${pre}-facilities`, `${pre}-facility-total`, d[`${k}_facilities`]);
          renderResources(pre, d[`${k}_resources`], d[`${k}_resources_pending`]);
          renderRates(`${pre}-rates`, d[`${k}_gross_rate`]);
          renderPower(`${pre}-power`, d[`${k}_facilities`], d[`${k}_pals`], d[`${k}_power_storage`]);
          renderFood(`${pre}-food-inline`, d[`${k}_food_storage`], d[`${k}_food_consumption`]);
        }
        renderIdlePanel('idle-content', d);

        // Players
        renderPlayers(d.all_players);
        renderAlerts(d);

        // Server info
        const info = document.getElementById('server-info');
        const lines = [];
        if (d.server_name) lines.push(d.server_name);
        if (d.server_version) lines.push(`版本 ${d.server_version}`);
        lines.push(`数据更新 ${d.updated_at || '--'}`);
        info.innerHTML = lines.map(l => `<span>${l}</span>`).join('');

        // Update time
        document.getElementById('update-time').textContent = d.updated_at || '--';

        // The calculator reads the same per-base stock this poll just
        // delivered, so it re-runs with it rather than waiting for a click.
        if (CRAFT_INDEX.length) { renderCraftList(); renderCraftDetail(); }

        // Charts pull their own (much larger) history files, and only
        // while they're open — see refreshCharts.
        refreshCharts();

      } catch (err) {
        console.error('Fetch error:', err);
        markFetchFailed('网络错误');
      }
    }

    try {
      const savedTab = localStorage.getItem('activeTab');
      if (savedTab) switchTab(savedTab);
    } catch (e) {}
    restoreUiState();
    applySeriesToggles();

    loadNameData().then(fetchData);
    // 60s, not 15s. Most of these polls are answered from the file in well
    // under a millisecond — palmon/server.py only re-parses the save when
    // the save itself has moved on (it is rewritten every few minutes) or
    // when status.json passes [web] live_max_age_seconds. But nothing on
    // this page moves fast enough to need a 15-second refresh either, and a
    // shorter interval would just raise the share of polls that pay for a
    // full parse.
    setInterval(fetchData, 60000);
  </script>
</body>
</html>
