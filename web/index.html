        ${sysPts ? `<path d="${sysLinePath}" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
        ${xLabels}
        ${lastDots}
        <g style="pointer-events:none">
          <line id="mem-crosshair" x1="0" y1="${PAD_T}" x2="0" y2="${PAD_T + innerH}" stroke="var(--border-hover)" stroke-width="1" visibility="hidden"/>
          <circle id="mem-hover-dot-sys_pct" r="4" fill="var(--cyan)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
          <circle id="mem-hover-dot-palserver_mb" r="4" fill="var(--indigo)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
          <circle id="mem-hover-dot-online_players" r="4" fill="var(--green)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
        </g>
        <rect id="mem-hit-rect" x="${PAD_L}" y="${PAD_T}" width="${innerW}" height="${innerH}" fill="transparent"/>
      `;

      const hitRect = document.getElementById('mem-hit-rect');
      const crosshair = document.getElementById('mem-crosshair');
      const hoverDots = {};
      SERIES.forEach(s => { hoverDots[s.key] = document.getElementById(`mem-hover-dot-${s.key}`); });

      function relXFromEvent(evt) {
        const rect = svg.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        return (clientX - rect.left) / rect.width;
      }

      function onMove(evt) {
        const svgX = relXFromEvent(evt) * W;
        let idx = Math.round(((svgX - PAD_L) / innerW) * (n - 1));
        idx = Math.max(0, Math.min(n - 1, idx));
        const px = xAt(idx);
        const point = history[idx];

        crosshair.setAttribute('x1', px); crosshair.setAttribute('x2', px);
        crosshair.setAttribute('visibility', 'visible');

        SERIES.forEach(s => {
          const dot = hoverDots[s.key];
          if (!visibleKeys.has(s.key)) { dot.setAttribute('visibility', 'hidden'); return; }
          const py = yAt(s.key, point[s.key]);
          dot.setAttribute('cx', px); dot.setAttribute('cy', py);
          dot.setAttribute('visibility', 'visible');
        });

        const pointPalPct = palPct(point.palserver_mb);
        tooltip.style.display = 'block';
        tooltip.style.left = `${(px / W) * 100}%`;
        // Anchored to the first series actually drawn — sys_pct's position is
        // meaningless (and its line absent) when it's switched off.
        const anchor = visible[0].key;
        tooltip.style.top = `${(yAt(anchor, point[anchor]) / H) * 100}%`;
        tooltip.querySelector('.mt-time').textContent = point.t;
        document.getElementById('mt-sys').textContent = `系统内存 ${point.sys_pct}%`;
        document.getElementById('mt-pal').textContent = pointPalPct === null
          ? `PalServer ${point.palserver_mb}MB`
          : `PalServer ${point.palserver_mb}MB (${pointPalPct.toFixed(1)}%)`;
        document.getElementById('mt-players').textContent = `在线人数 ${point.online_players ?? 0} 人`;
        // A hidden series has no dot and no crosshair reading either.
        SERIES.forEach(s => {
          document.getElementById(s.tipId).style.display = visibleKeys.has(s.key) ? '' : 'none';
        });
      }

      function onLeave() {
        crosshair.setAttribute('visibility', 'hidden');
        SERIES.forEach(s => hoverDots[s.key].setAttribute('visibility', 'hidden'));
        tooltip.style.display = 'none';
      }

      hitRect.addEventListener('mousemove', onMove);
      hitRect.addEventListener('mouseleave', onLeave);
      hitRect.addEventListener('touchmove', onMove, { passive: true });
      hitRect.addEventListener('touchend', onLeave);
    }

    // The collapse headers are <div>s (they hold their own nested buttons,
    // so they can't be <button>s themselves) and get no Enter/Space handling
    // for free. Delegated rather than per-element because several of these
    // headers are generated by renderIdlePanel on every poll.
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const t = e.target;
      if (!t || !t.matches || !t.matches('[data-keyactivate]')) return;
      e.preventDefault();
      t.click();
    });

    // ─── Base panels ───
    // Which bases exist is the backend's answer (status.json's "bases"),
    // not a constant here: _get_base_meta enumerates every base camp the
    // player's guild owns, so building a new one in-game gives it a panel
    // on the next poll. This table only supplies presentation per
    // position; a base past the end of it still renders, under a generic
    // label, rather than silently not rendering at all.
    const BASE_STYLES = [
      { label: '1号据点', icon: '🚩', color: 'var(--cyan)' },
      { label: '2号据点', icon: '⛰️', color: 'var(--indigo)' },
      { label: '3号据点', icon: '🏯', color: 'var(--amber)' },
      { label: '4号据点', icon: '🏕️', color: 'var(--green)' },
    ];
    // [{ key: 'base1', prefix: 'b1', label, icon, color }], rebuilt by
    // syncBasePanels whenever the set of bases changes. Everything that
    // used to name b1/b2 explicitly iterates this instead.
    let BASES = [];

    function basePanelHtml(b) {
      return `<div class="base-panel" id="${b.key}-panel" style="--base-color:${b.color}">
          <div class="base-header">
            <div class="base-title">
              <span class="base-title-name">${b.icon} ${b.label}</span>
              <span class="base-badge" id="${b.prefix}-count">0</span>
              <span class="base-role" id="${b.prefix}-role"></span>
              <span class="base-food-inline" id="${b.prefix}-food-inline"></span>
            </div>
          </div>
          <div class="base-body">
            <div class="econ-section">
              <div class="econ-heading">📦 据点物资</div>
              <div class="res-group raw">
                <div class="res-group-head collapse-head" role="button" tabindex="0" data-keyactivate
                     onclick="toggleResourceGrid('${b.prefix}-res-raw','${b.prefix}-res-raw-toggle')">
                  <span class="res-group-icon">⛏️</span>
                  <span class="res-group-title">原材料</span>
                  <span class="res-group-sub">采集 / 种植 / 帕鲁掉落</span>
                  <span class="res-group-count" id="${b.prefix}-res-raw-count"></span>
                  <button class="econ-toggle-btn" id="${b.prefix}-res-raw-toggle" onclick="event.stopPropagation(); toggleResourceGrid('${b.prefix}-res-raw','${b.prefix}-res-raw-toggle')">展开全部</button>
                </div>
                <div class="resource-grid truncated" id="${b.prefix}-res-raw"></div>
              </div>
              <div class="res-group proc">
                <div class="res-group-head collapse-head" role="button" tabindex="0" data-keyactivate
                     onclick="toggleResourceGrid('${b.prefix}-res-proc','${b.prefix}-res-proc-toggle')">
                  <span class="res-group-icon">⚙️</span>
                  <span class="res-group-title">一次加工材料</span>
                  <span class="res-group-sub">熔炼 / 工作台一步加工</span>
                  <span class="res-group-count" id="${b.prefix}-res-proc-count"></span>
                  <button class="econ-toggle-btn" id="${b.prefix}-res-proc-toggle" onclick="event.stopPropagation(); toggleResourceGrid('${b.prefix}-res-proc','${b.prefix}-res-proc-toggle')">展开全部</button>
                </div>
                <div class="resource-grid truncated" id="${b.prefix}-res-proc"></div>
              </div>
            </div>
            <div class="econ-row">
              <div class="econ-section">
                <div class="econ-heading">⚙️ 核心产出速率 <span class="econ-unit">每小时</span></div>
                <div id="${b.prefix}-rates"><div class="empty-state">数据采集中…</div></div>
              </div>
              <div class="econ-section">
                <div class="econ-heading">⚡ 电力</div>
                <div id="${b.prefix}-power"><div class="empty-state">数据采集中…</div></div>
              </div>
            </div>
            <div class="econ-section">
              <div class="econ-heading collapse-head" role="button" tabindex="0" data-keyactivate
                   onclick="toggleCollapse('${b.prefix}-facilities','${b.prefix}-facilities-toggle')">
                🏭 设施 <span id="${b.prefix}-facility-total"></span>
                <button class="econ-toggle-btn" id="${b.prefix}-facilities-toggle" onclick="event.stopPropagation(); toggleCollapse('${b.prefix}-facilities','${b.prefix}-facilities-toggle')">展开</button>
              </div>
              <div class="facility-chips collapsible collapsed" id="${b.prefix}-facilities"></div>
            </div>
            <div class="econ-section">
              <div class="econ-heading">🐾 帕鲁 / 工作适应性</div>
              <div class="pal-filter" id="${b.prefix}-pal-filter"></div>
              <div class="pal-table-wrap" id="${b.prefix}-pal-table"></div>
            </div>
          </div>
        </div>`;
    }

    // Rebuild the panels only when the set of base keys actually changes —
    // every poll would otherwise blow away the DOM (and with it the open
    // resource grids and charts) sixty times an hour for no reason.
    function syncBasePanels(keys) {
      const wanted = (keys && keys.length ? keys : ['base1', 'base2']);
      if (BASES.length === wanted.length && BASES.every((b, i) => b.key === wanted[i])) return;

      BASES = wanted.map((key, i) => {
        const n = parseInt(key.slice(4), 10) || (i + 1);
        const style = BASE_STYLES[n - 1] || { label: `${n}号据点`, icon: '📍', color: 'var(--text-faint)' };
        return { key, prefix: `b${n}`, ...style };
      });
      for (const b of BASES) {
        if (palFilter[b.prefix] === undefined) palFilter[b.prefix] = uiState[`f:${b.prefix}`] || 'ALL';
        if (groupCollapsed[b.key] === undefined) groupCollapsed[b.key] = !!uiState[`g:${b.key}`];
      }
      document.getElementById('bases-col').innerHTML = BASES.map(basePanelHtml).join('');
      document.getElementById('base-tab-nav').innerHTML = BASES.map(b => `
        <button class="base-tab-btn" id="${b.prefix}-tab" style="--base-color:${b.color}" onclick="switchBase('${b.key}')">
          ${b.icon} ${b.label}<span class="base-tab-count" id="${b.prefix}-tab-count"></span>
        </button>`).join('');
      COLLAPSIBLES = STATIC_COLLAPSIBLES.concat(
        BASES.map(b => [`${b.prefix}-facilities`, `${b.prefix}-facilities-toggle`]));
      RESOURCE_GRIDS = BASES.flatMap(b => [
        [`${b.prefix}-res-raw`, `${b.prefix}-res-raw-toggle`],
        [`${b.prefix}-res-proc`, `${b.prefix}-res-proc-toggle`],
      ]);
      restoreUiState();
      applyBaseSelection();
      renderCraftBaseChips();
    }

    // Which base's panel is on screen. Remembered across reloads like every
    // other panel state; a remembered base that no longer exists (it was
    // dismantled in-game, or this is a first visit) falls back to the first
    // one rather than leaving the tab empty.
    let activeBase = null;

    function switchBase(key) {
      activeBase = key;
      uiState['a:base'] = key;
      saveUiState();
      applyBaseSelection();
    }

    function applyBaseSelection() {
      if (!BASES.length) return;
      if (activeBase === null) activeBase = uiState['a:base'] || null;
      if (!BASES.some(b => b.key === activeBase)) activeBase = BASES[0].key;
      for (const b of BASES) {
        const on = b.key === activeBase;
        document.getElementById(`${b.key}-panel`).classList.toggle('active', on);
        document.getElementById(`${b.prefix}-tab`).classList.toggle('active', on);
      }
      syncPalHeadPins();
    }

    // Tab switching: which tab is active is purely a display:none/block
    // toggle — fetchData() keeps rendering into every tab's elements
    // regardless of which one is visible, so switching tabs never shows
    // stale data and never needs a re-fetch.
    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${name}`));
      try { localStorage.setItem('activeTab', name); } catch (e) {}
      syncPalHeadPins();
    }

    // Re-renders instantly from the last poll's data rather than waiting
    // up to 15s for the next fetchData() tick.
    let lastData = null;

    // Theme: light is the default (no data-theme attribute — :root's base
    // palette is light), dark is opt-in via :root[data-theme="dark"]. The
    // choice is remembered in localStorage so it survives a refresh.
    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const next = isDark ? 'light' : 'dark';
      localStorage.setItem('palDashboardTheme', next);
      applyTheme(next);
    }
    applyTheme(localStorage.getItem('palDashboardTheme') || 'light');

    function setResourceGrid(gridId, toggleId, truncated) {
      const grid = document.getElementById(gridId);
      const btn = document.getElementById(toggleId);
      if (!grid || !btn) return;
      grid.classList.toggle('truncated', truncated);
      btn.textContent = truncated ? '展开全部' : '收起';
    }

    function toggleResourceGrid(gridId, toggleId) {
      const truncated = !document.getElementById(gridId).classList.contains('truncated');
      setResourceGrid(gridId, toggleId, truncated);
      uiState[`r:${gridId}`] = truncated;
      saveUiState();
    }

    function setCollapsed(elId, btnId, collapsed) {
      const el = document.getElementById(elId);
      const btn = document.getElementById(btnId);
      if (!el || !btn) return;
      el.classList.toggle('collapsed', collapsed);
      btn.textContent = collapsed ? '展开' : '收起';
    }

    function toggleCollapse(elId, btnId) {
      const collapsed = !document.getElementById(elId).classList.contains('collapsed');
      setCollapsed(elId, btnId, collapsed);
      uiState[`c:${elId}`] = collapsed;
      saveUiState();
      // Chart bodies hold no data until they're opened — see refreshCharts.
      if (!collapsed && CHART_BODIES.includes(elId)) refreshCharts();
    }

    // Every collapsible on the page, as [bodyId, toggleButtonId]. Used to
    // restore the saved open/closed state on load; the toggle handlers
    // above write into the same uiState the restore pass reads.
    const STATIC_COLLAPSIBLES = [
      ['idle-content', 'idle-toggle'],
      ['mem-chart-body', 'mem-chart-toggle'],
    ];
    // The per-base entries are appended by syncBasePanels once it knows
    // which panels exist — a base's collapsibles can't be registered
    // before its markup has been created.
    let COLLAPSIBLES = STATIC_COLLAPSIBLES.slice();
    let RESOURCE_GRIDS = [];
    const CHART_BODIES = ['mem-chart-body'];

    function restoreUiState() {
      for (const [elId, btnId] of COLLAPSIBLES) {
        const saved = uiState[`c:${elId}`];
        if (saved !== undefined) setCollapsed(elId, btnId, saved);
        else setCollapsed(elId, btnId, document.getElementById(elId).classList.contains('collapsed'));
      }
      for (const [gridId, btnId] of RESOURCE_GRIDS) {
        const saved = uiState[`r:${gridId}`];
        if (saved !== undefined) setResourceGrid(gridId, btnId, saved);
      }
    }

    // ─── Chart history: fetched on demand, never inlined in status.json ───
    // memory_history.json is ~150KB and used to ride along inside
    // status.json on every poll, for a chart that is often never opened.
    // It's read only while that chart is actually on screen.
    // (food_history.json is still written by the backend — it's what the
    // depletion estimate in each base header is computed from — but nothing
    // on this page fetches it since the per-base satiety chart was removed.)
    let memoryHistory = [];
    async function loadMemoryHistory() {
      try {
        const r = await fetch(`memory_history.json?t=${Date.now()}`);
        if (r.ok) memoryHistory = await r.json();
      } catch (e) { /* keep the previous copy rather than blanking the chart */ }
      return memoryHistory;
    }

    function isOpen(id) {
      const el = document.getElementById(id);
      return el && !el.classList.contains('collapsed');
    }

    async function refreshCharts() {
      if (isOpen('mem-chart-body')) renderMemChart(await loadMemoryHistory());
    }

    // Item/building display names come from the game's own official
    // zh-Hans localization (vendored from palworld-save-pal's data set,
    // keyed by the same internal IDs the save file uses — see
    // the state directory's data/*_l10n.json), fetched once at load rather than
    // hand-typed, so display text actually matches in-game names.
    // Unrecognized IDs fall back to the raw save-file ID.
    let ITEM_NAMES = {};
    let BUILDING_NAMES = {};
    let PAL_NAMES = {};
    function itemName(id) { return (ITEM_NAMES[id] && ITEM_NAMES[id].localized_name) || id; }
    function facilityName(id) { return (BUILDING_NAMES[id] && BUILDING_NAMES[id].localized_name) || id; }
    // Wild "Alpha"/boss pals reuse their base species' name in-game (a
    // badge marks them as a boss, not a separate name) — palworld-save-pal's
    // l10n data reflects that: boss-prefixed CharacterIDs aren't their own
    // entries, so a miss on the raw id falls back to the id with that
    // prefix stripped before giving up and showing the raw id. The prefix
    // casing isn't consistent in the save data itself (BOSS_Manticore but
    // Boss_Anubis), so this strips case-insensitively.
    function palName(id) {
      if (PAL_NAMES[id]) return PAL_NAMES[id].localized_name;
      const m = id.match(/^boss_(.+)$/i);
      const stripped = m ? m[1] : null;
      if (stripped && PAL_NAMES[stripped]) return PAL_NAMES[stripped].localized_name;
      return id;
    }

    // Non-localized gameplay metadata (item category, pal work-suitability
    // ranks) — same vendored source as the *_l10n.json name files, just the
    // data half instead of the display-name half.
    let ITEMS_META = {};
    let PALS_META = {};
    let WORK_SUITABILITY_NAMES = {};
    let BUILDINGS_META = {};
    // { items: {itemId: [{materials:[[id,count]...], count, work, ambiguous?}]},
    //   buildings: {buildingId: {materials, work}} } — built by
    // build_recipe_data.py; see that script's docstring for where each half
    // comes from and why the game's own pak isn't the source.
    let RECIPES = { items: {}, buildings: {} };
    // { shops: {shopId: {merchant, locations:[{name, coords?}], note?}},
    //   items: {itemId: [{shop, price, currency}]} } — built by
    // build_merchant_data.py. Answers "this material can just be bought, and
    // here is who from and where they stand".
    let MERCHANTS = { shops: {}, items: {} };

    async function loadNameData() {
      try {
        const [items, buildings, pals, itemsMeta, palsMeta, suitabilityNames, buildingsMeta, recipes, merchants] = await Promise.all([
          fetch('data/items_l10n.json').then(r => r.json()),
          fetch('data/buildings_l10n.json').then(r => r.json()),
          fetch('data/pals_l10n.json').then(r => r.json()),
          fetch('data/items_meta.json').then(r => r.json()),
          fetch('data/pals_meta.json').then(r => r.json()),
          fetch('data/work_suitability_l10n.json').then(r => r.json()),
          fetch('data/buildings_meta.json').then(r => r.json()),
          fetch('data/recipes.json').then(r => r.json()),
          fetch('data/merchants.json').then(r => r.json()),
        ]);
        ITEM_NAMES = items;
        BUILDING_NAMES = buildings;
        PAL_NAMES = pals;
        ITEMS_META = itemsMeta;
        PALS_META = palsMeta;
        WORK_SUITABILITY_NAMES = suitabilityNames;
        BUILDINGS_META = buildingsMeta;
        RECIPES = recipes;
        MERCHANTS = merchants;
        buildCraftIndex();
      } catch (err) {
        console.error('Failed to load name data, falling back to raw IDs:', err);
      }
    }

    // "据点物资" is meant to answer "what raw/semi-processed materials does
    // this base have", not list every quest item, capture ball, or potion
    // that happens to be sitting in a chest — those clutter the view and
    // aren't "base economy" in the sense the dashboard is for. Palworld's
    // own item categorization (type_a/type_b, from the same vendored data
    // as the display names) makes this a lookup instead of a guess:
    // type_a "Material" already covers raw resources AND one-step
    // processed goods (ore -> ingot) in the same bucket; type_a "Food"
    // covers raw crop/animal produce, but its "FoodDish*" subtypes are
    // cooked multi-ingredient meals, a step beyond "primary processed", so
    // those are excluded. Money is tagged type_a Material by the game but
    // isn't a base resource in any meaningful sense, so it's special-cased out.
    function isResourceItem(id) {
      const meta = ITEMS_META[id];
      if (!meta || id === 'Money') return false;
      if (meta.type_a === 'Material') return true;
      if (meta.type_a === 'Food') return !(meta.type_b || '').startsWith('FoodDish');
      return false;
    }
    // "矿物" for the pre-expand sort priority: raw ore/stone specifically,
    // not the wood/food/ingot items that also pass isResourceItem().
    function isMineral(id) {
      const meta = ITEMS_META[id];
      return !!meta && (meta.type_b === 'MaterialOre' || meta.type_b === 'MaterialStone');
    }

    function suitabilityName(id) {
      return (WORK_SUITABILITY_NAMES[id] && WORK_SUITABILITY_NAMES[id].localized_name) || id;
    }
    // Same boss-prefix fallback as palName(), for looking up a pal's
    // work-suitability ranks by CharacterID.
    function palWorkSuitability(id) {
      if (PALS_META[id]) return PALS_META[id].work_suitability || null;
      const m = id.match(/^boss_(.+)$/i);
      const stripped = m ? m[1] : null;
      if (stripped && PALS_META[stripped]) return PALS_META[stripped].work_suitability || null;
      return null;
    }

    // Which crafted item each station type turns out. Only the mapping is
    // here — the recipes themselves come from recipes.json like everywhere
    // else on this page, because the datamined recipe table records what a
    // recipe costs but not which station runs it, and a second hand-kept
    // copy of the costs is a copy that goes stale (the one this replaced
    // had lost 石英 from the 帕鲁金属锭 recipe).
    //
    // The furnace list carries the upgrade tiers as well as the first
    // three: a save whose furnaces are all 巨大熔炉 / 古代文明炉 would
    // otherwise read "未建造" on every ingot row while two furnaces stood
    // there smelting.
    const FURNACE_TYPES = ['BlastFurnace', 'BlastFurnace2', 'BlastFurnace3', 'BlastFurnace4', 'AncientBlastFurnace'];
    const STATION_OUTPUTS = {
      Crusher: ['Pal_crystal_S'],
      ...Object.fromEntries(FURNACE_TYPES.map(f => [f, ['CopperIngot', 'IronIngot', 'StealIngot']])),
    };

    // Every way this station type can make something, as [outputId,
    // {materialId: count}] — the recipe rows recipes.json holds for each of
    // its output items.
    function stationRecipes(type) {
      return (STATION_OUTPUTS[type] || []).flatMap(itemId =>
        (RECIPES.items[itemId] || []).map(r =>
          [itemId, Object.fromEntries(r.materials.map(([id, n]) => [id, n]))]));
    }
    // ─── What each base is for ───
    // The classification itself is the backend's (see _classify_base_role
    // in palmon/metrics.py): it reads the game's own building
    // datatable to bucket each placed facility, and cross-checks the
    // result against what the base measurably produced in the last hour.
    // Only the wording is decided here.
    const ROLE_ZH = {
      gathering: '采集', crafting: '加工', farming: '种植',
      cooking: '烹饪', breeding: '繁育', power: '供电',
    };
    const OUTPUT_BUCKET_ZH = { gathering: '原料', crafting: '加工品', food: '食物', other: '其他' };

    function baseRoleLabel(role) {
      const tags = (role && role.tags) || [];
      if (!tags.length) return '';
      return `${tags.map(t => ROLE_ZH[t] || t).join('·')}据点`;
    }

    // The one-line detail under the label: what it actually produced in
    // the measured window, and — when a base is built for work it isn't
    // doing — which of its roles came back empty. "还在积累数据" is a
    // third, distinct state: no window yet is not the same as no output.
    function baseRoleDetail(role) {
      if (!role || !role.tags || !role.tags.length) return '';
      const minutes = role.output_minutes || 0;
      if (!minutes) return '产出数据积累中';
      const parts = Object.entries(role.output || {})
        .filter(([, v]) => v > 0)
        .sort((a, c) => c[1] - a[1])
        .map(([k, v]) => `${OUTPUT_BUCKET_ZH[k] || k} +${v.toLocaleString()}`);
      const stalled = (role.stalled || []).map(t => ROLE_ZH[t] || t);
      const head = parts.length ? `近${minutes}分钟 ${parts.join(' · ')}` : `近${minutes}分钟无产出`;
      return stalled.length ? `${head}（${stalled.join('/')}无产出）` : head;
    }

    // Per-base collapse state for the idle panel, independent of the
    // whole-card collapse toggle — re-render regenerates that panel's
    // innerHTML from scratch every poll, so the open/closed state has to
    // live here rather than on the (about to be replaced) DOM nodes.
    // Seeded per base by syncBasePanels, from the same saved uiState.
    const groupCollapsed = {};

    function toggleGroupCollapse(baseKey) {
      groupCollapsed[baseKey] = !groupCollapsed[baseKey];
      uiState[`g:${baseKey}`] = groupCollapsed[baseKey];
      saveUiState();
      if (lastData) renderIdlePanel('idle-content', lastData);
    }

    // Wraps one base's section body in a clickable heading + collapsible
    // body, sharing the collapse state above across re-renders.
    function baseGroupBlock(g, bodyHtml) {
      const collapsed = groupCollapsed[g.key];
      return `
        <div class="proposal-base-heading collapse-head" role="button" tabindex="0" data-keyactivate onclick="toggleGroupCollapse('${g.key}')">
          <span class="base-collapse-arrow ${collapsed ? 'collapsed' : ''}">▾</span>${g.icon} ${g.label}${g.roleLabel ? `<span class="role-tag">${g.roleLabel}</span>` : ''}
        </div>
        <div class="collapsible ${collapsed ? 'collapsed' : ''}">${bodyHtml}</div>
      `;
    }

    // Below this, a pal/facility counts as "long-idle" rather than just
    // "not working this instant" — work_ratio (pal) and avg_staff_ratio
    // (staffed/task-type facility) are already long-run measures (see
    // their backend docstrings), so this is a threshold on a trend, not a
    // snapshot. Farm plots (auto-type) don't use this threshold at all —
    // see facilityCategory below.
    const IDLE_RATIO_THRESHOLD = 0.3;
    // A gross_rate window shorter than this isn't enough to call "no
    // output" a real trend rather than bad luck on the sampling window —
    // used for task-facility recipe output (hasNoActiveTask). Farm plots
    // don't need this either: their growth state is read directly, not
    // inferred from a windowed output history.
    const PRODUCTION_IDLE_MIN_MINUTES = 30;

    // What "idle" even means differs by what kind of work a facility type
    // needs — derived from FACILITY_SUITABILITY (already sourced from
    // official in-game descriptions) rather than a second hand-typed list:
    //  - Mining/Deforest/GenerateElectricity is continuous-presence work —
    //    output tracks staffing directly, so staffing ratio IS the idle
    //    signal (unchanged from before).
    //  - Seeding (farm plots) don't need anyone standing there once
    //    seeded — staffing ratio is meaningless for them, and so is an
    //    output-history proxy (a plot that's still growing normally has
    //    no output yet either). base1_farm_growth/base2_farm_growth
    //    (backend, from each plot's own save-data growth state) is the
    //    real idle signal instead — see buildIdleFacilityGroups' auto-row
    //    block.
    //  - Watering-only (Crusher/FlourMill), EmitFlame (kitchens/furnaces)
    //    and ProductMedicine need BOTH a worker present AND a
    //    raw-material task queued. Either one missing looks idle but
    //    needs a different fix, so both get checked and reported
    //    separately.
    //  - Handcraft (sphere/weapon assembly lines, workbenches) is
    //    excluded entirely rather than lumped into "task": a pal only
    //    ever staffs one of these once the player manually queues a
    //    specific item to build, so a 0% staffing ratio just means
    //    "nothing queued" — not understaffed. There's also no fixed
    //    recipe/output-item data for these (the player can queue
    //    anything), so "no task" can't be confirmed either. Reporting
    //    staffing for these would just be a false "无人在岗" every time
    //    nothing happens to be queued right now.
    function facilityCategory(type) {
      const suit = FACILITY_SUITABILITY[type];
      // Unclassified types are excluded, NOT reported as understaffed. The
      // old fallback was 'staffed', which meant every facility missing from
      // FACILITY_SUITABILITY got judged by staffing ratio — and the ones
      // missing are exactly the ones whose requirement is unknown or which
      // need no worker at all (BreedFarm, Lab, HatchingPalEgg, storage,
      // beds, hot springs). That produced flat false "长期无人在岗" alarms.
      // Staying silent about a facility we can't classify is the correct
      // failure mode; the fix for a real omission is to add it above.
      if (!suit) return 'excluded';
      if (suit.includes('Seeding')) return 'auto';
      if (suit.some(s => ['Mining', 'Deforest', 'GenerateElectricity', 'MonsterFarm'].includes(s))) return 'staffed';
      if (suit.includes('Handcraft')) return 'excluded';
      // Medicine benches only run when somebody is actually sick, so an
      // empty one is normal, not idle — reported only alongside a sick pal.
      if (suit.includes('ProductMedicine')) return 'ondemand';
      return 'task';
    }


    // Whether currently-stored+pending raw material is enough for at least
    // one recipe this facility type can run — null when this facility type
    // isn't one STATION_OUTPUTS maps, so callers can tell "confirmed short
    // on material" apart from "unknown, no recipe data for this one"
    // instead of the two looking the same.
    function materialAvailability(type, resources, pending) {
      const stockOf = id => (resources[id] || 0) + (pending[id] || 0);
      const recipes = stationRecipes(type);
      if (recipes.length === 0) return null;
      return recipes.some(([, inputs]) =>
        Object.entries(inputs).every(([inId, need]) => stockOf(inId) >= need));
    }

    // Whether a staffed facility has actually been *producing* anything —
    // distinct from materialAvailability's "is there enough raw material
    // in storage" (a full stockpile doesn't mean the player ever queued a
    // recipe for it to consume). STATION_OUTPUTS names this facility
    // type's output items directly — reusing the same gross_rate item-gain data
    // renderRates already shows, the same way farm output is checked.
    // Returns null (unknown, not true) rather than false when this
    // facility type isn't one of the few recipes modeled, or the window is
    // too short to trust — "no confirmed output" and "confirmed no output"
    // shouldn't look the same.
    function hasNoActiveTask(type, gainByItem, minutesOk) {
      const outputItems = STATION_OUTPUTS[type] || [];
      if (outputItems.length === 0 || !minutesOk) return null;
      return outputItems.every(itemId => !gainByItem[itemId]);
    }

    function idlePalTable(pals) {
      return `<table class="proposal-table">
        <thead><tr><th>帕鲁</th><th>工作占比</th><th>样本数</th></tr></thead>
        <tbody>${pals.map(p => `<tr>
          <td>${p.name ? `${p.name} <span class="pal-type">${palName(p.type)}</span>` : palName(p.type)}</td>
          <td>${Math.round(p.work_ratio * 100)}%</td>
          <td>${p.work_ratio_samples}</td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

    function staffedFacilityTable(facs) {
      return `<table class="proposal-table">
        <thead><tr><th>设施</th><th>已建</th><th>平均在岗率</th></tr></thead>
        <tbody>${facs.map(f => `<tr>
          <td>${facilityName(f.type)}</td>
          <td>${f.placed}</td>
          <td>${Math.round(f.avg_staff_ratio * 100)}%</td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

    function autoFacilityTable(facs) {
      return `<table class="proposal-table">
        <thead><tr><th>设施</th><th>已建</th><th>状态</th></tr></thead>
        <tbody>${facs.map(f => `<tr>
          <td>${facilityName(f.type)}</td>
          <td>${f.placed}</td>
          <td>${f.waiting}/${f.placed} 已成熟待收获</td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

    // A "无任务" row deliberately blanks its 在岗率 cell: when nothing is
    // queued, the staffing ratio is a consequence of that, and printing it
    // next to the real root cause just invites fixing the wrong thing.
    function taskFacilityTable(facs) {
      return `<table class="proposal-table">
        <thead><tr><th>设施</th><th>已建</th><th>在岗率</th><th>原因</th></tr></thead>
        <tbody>${facs.map(f => `<tr>
          <td>${facilityName(f.type)}</td>
          <td>${f.placed}</td>
          <td>${f.reason === '无任务' ? '<span class="muted-cell">—</span>' : `${Math.round(f.avg_staff_ratio * 100)}%`}</td>
          <td>${f.reason}</td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

    function buildIdleFacilityGroups(b, d) {
      const facilityIdle = d[`${b.key}_facility_idle`] || {};
      const facilitiesNow = d[`${b.key}_facilities`] || {};
      const resources = d[`${b.key}_resources`] || {};
      const pending = d[`${b.key}_resources_pending`] || {};
      const grossRate = d[`${b.key}_gross_rate`] || { items: [], minutes: 0 };
      const gainByItem = {};
      grossRate.items.forEach(it => { gainByItem[it.item] = it.gross_gain; });

      const staffedRows = [];
      const taskRows = [];
      const autoRows = [];

      const minutesOk = grossRate.minutes >= PRODUCTION_IDLE_MIN_MINUTES;

      // Medicine benches (cat 'ondemand') are only worth flagging when
      // there is actually somebody to treat — an unmanned clinic with no
      // sick pal in the base is working as intended, not idle.
      const hasSickPal = (d[`${b.key}_pals`] || []).some(p => p.sick);

      for (const [type, info] of Object.entries(facilityIdle)) {
        const cat = facilityCategory(type);
        if (cat === 'staffed') {
          if (info.avg_staff_ratio < IDLE_RATIO_THRESHOLD) staffedRows.push({ type, ...info });
        } else if (cat === 'ondemand') {
          if (hasSickPal && info.avg_staff_ratio < IDLE_RATIO_THRESHOLD) {
            taskRows.push({ type, ...info, reason: '有帕鲁生病，但无人在岗' });
          }
        } else if (cat === 'task') {
          const matOk = materialAvailability(type, resources, pending);
          const noTask = hasNoActiveTask(type, gainByItem, minutesOk);
          const staffLow = info.avg_staff_ratio < IDLE_RATIO_THRESHOLD;
          const matBad = matOk === false;
          if (!staffLow && !matBad && !noTask) continue;
          // noTask is checked first: when it's confirmed true, "nobody's
          // queued a recipe" is the root cause and a low staffing ratio is
          // just a downstream symptom of that (no task queued -> nothing
          // for a pal to do there -> it doesn't get assigned) rather than
          // an independent problem. So it's reported alone — appending
          // "长期无人在岗" on top would bury the one thing that actually
          // needs fixing under a symptom of it.
          let reason;
          if (noTask) reason = '无任务';
          else if (staffLow && matBad) reason = '无人在岗 + 原料不足';
          else if (staffLow) reason = matOk === null ? '无人在岗' : '无人在岗（原料充足）';
          else reason = '已在岗，但原料长期不足';
          taskRows.push({ type, ...info, reason });
        }
        // 'auto' (farm) rows are handled below from facilitiesNow instead —
        // facility_idle only tracks staffing, which doesn't apply to farms.
      }

      // Read straight from each plot's own growth state (base1_farm_growth /
      // base2_farm_growth — see _parse_farm_growth_state's docstring)
      // instead of inferring idleness from output history: a farm plot
      // doesn't need continuous staffing, and a "still growing, no output
      // yet" plot isn't idle just because its window looks flat. Only
      // report a crop type when at least one of its plots is confirmed
      // matured-and-uncollected ("waiting"); a plot still growing is left
      // out entirely, not shown as any kind of status.
      const farmGrowth = d[`${b.key}_farm_growth`] || {};
      for (const [type, growth] of Object.entries(farmGrowth)) {
        if (growth.waiting > 0) {
          const placed = facilitiesNow[type] || (growth.growing + growth.waiting + growth.other);
          autoRows.push({ type, placed, waiting: growth.waiting });
        }
      }

      staffedRows.sort((a, c) => a.avg_staff_ratio - c.avg_staff_ratio);
      taskRows.sort((a, c) => a.avg_staff_ratio - c.avg_staff_ratio);
      autoRows.sort((a, c) => c.waiting - a.waiting);
      return { staffedRows, taskRows, autoRows };
    }

    // Grouped by base rather than one flat table spanning all of them, so
    // the base column doesn't repeat on every row: pals well below the
    // work-ratio threshold, plus each facility category's own idle
    // criterion, sorted most-idle-first, under their own base heading.
    function renderIdlePanel(elId, d) {
      const el = document.getElementById(elId);
      const groups = BASES.map(b => {
        const pals = (d[`${b.key}_pals`] || [])
          .filter(p => p.work_ratio != null && p.work_ratio < IDLE_RATIO_THRESHOLD)
          .sort((a, c) => a.work_ratio - c.work_ratio);
        return { ...b, pals, ...buildIdleFacilityGroups(b, d), roleLabel: baseRoleLabel(d[`${b.key}_role`] || {}) };
      });

      const isEmpty = g => g.pals.length === 0 && g.staffedRows.length === 0
        && g.taskRows.length === 0 && g.autoRows.length === 0;

      if (groups.every(isEmpty)) {
        // "Nothing is idle" and "there is nothing to judge idleness with
        // yet" look identical in an empty panel, and they mean opposite
        // things — the second one shows up for ~20 minutes after the job
        // history's schema is bumped (PAL_JOBS_SCHEMA), which discards the
        // older samples on purpose. A pal keeps work_ratio: null until it
        // has enough usable samples, so that's the signal.
        const measured = BASES.some(b => (d[`${b.key}_pals`] || []).some(p => p.work_ratio != null));
        el.innerHTML = measured
          ? '<div class="empty-state">暂无长期空闲的帕鲁或设施</div>'
          : '<div class="empty-state">工作记录基准刚重置，正在重新积累样本（约 20 分钟后给出趋势）</div>';
        return;
      }

      el.innerHTML = groups.filter(g => !isEmpty(g)).map(g => baseGroupBlock(g, `
        ${g.pals.length ? `<div class="proposal-subheading">长期低负载帕鲁</div>${idlePalTable(g.pals)}` : ''}
        ${g.staffedRows.length ? `<div class="proposal-subheading">值守型设施（长期无人在岗）</div>${staffedFacilityTable(g.staffedRows)}` : ''}
        ${g.autoRows.length ? `<div class="proposal-subheading">自运行型设施（农园，已成熟待收获）</div>${autoFacilityTable(g.autoRows)}` : ''}
        ${g.taskRows.length ? `<div class="proposal-subheading">任务+值守型设施（无任务 / 缺原料 / 缺人手）</div>${taskFacilityTable(g.taskRows)}` : ''}
      `)).join('');
    }

    // Facility MapObjectId -> work-suitability type(s) it requires a pal to
    // have to operate it. Not present in any vendored data file (checked) —
    // derived from this session's own fetch of the official zh-Hans building
    // descriptions, which mostly spell out the requirement directly (e.g.
    // StonePit: "挖掘...交给擅长挖掘的帕鲁吧"; Crusher/FlourMill: "需要有
    // 具备「浇水」适应性的帕鲁"; kitchens/furnaces: "需要火系帕鲁点火").
    // Only facilities with an explicit, evidenced requirement are listed;
    // ambiguous ones (Lab, BreedFarm, HatchingPalEgg) are deliberately left
    // out rather than guessed, same policy as everywhere else in this file.
    const FACILITY_SUITABILITY = {
      CoalPit: ['Mining'], CopperPit: ['Mining'], CopperPit_2: ['Mining'],
      QuartzPit: ['Mining'], StonePit: ['Mining'], SulfurPit: ['Mining'],
      CrystalPit: ['Mining'], SkyIslandOrePit: ['Mining'],
      StationDeforest2: ['Deforest'], StationDeforest3: ['Deforest'],
      OilPump02: ['OilExtraction'],
      BlastFurnace: ['EmitFlame'], BlastFurnace2: ['EmitFlame'], BlastFurnace3: ['EmitFlame'],
      BlastFurnace4: ['EmitFlame'], AncientBlastFurnace: ['EmitFlame', 'Cool'],
      CampFire: ['EmitFlame'], CookingStove: ['EmitFlame'], ElectricKitchen: ['EmitFlame'],
      HugeKitchen: ['EmitFlame'], Torch: ['EmitFlame'],
      AncientCookingStove: ['EmitFlame', 'Handcraft'],
      Crusher: ['Watering'], FlourMill: ['Watering'],
      Factory_Hard_01: ['Handcraft'], Factory_Hard_02: ['Handcraft'], Factory_Hard_03: ['Handcraft'],
      Factory_Hard_04: ['Handcraft'], FishingPond2: ['Handcraft'],
      AncientWorkBench: ['Handcraft', 'ProductMedicine'],
      WeaponFactory_Dirty_01: ['Handcraft'], WeaponFactory_Dirty_02: ['Handcraft'], WeaponFactory_Dirty_03: ['Handcraft'],
      SphereFactory_Black_02: ['Handcraft'], SphereFactory_Black_03: ['Handcraft'],
      SphereFactory_Black_04: ['Handcraft'],
      WorkBench_SkillUnlock: ['Handcraft'], Workbench: ['Handcraft'], CompositeDesk: ['Handcraft'],
      MedicineFacility_01: ['ProductMedicine'], MedicineFacility_02: ['ProductMedicine'],
      MedicineFacility_03: ['ProductMedicine'], Clinic: ['ProductMedicine'],
      ElectricGenerator: ['GenerateElectricity'], ElectricGenerator_Large: ['GenerateElectricity'],
      // "需要有高级发电适应性的帕鲁，还需要具备浇水适应性的帕鲁负责冷却"
      AncientElectricGenerator: ['GenerateElectricity', 'Watering'],
      MonsterFarm: ['MonsterFarm'],
      Refrigerator: ['Cool'], CoolerBox: ['Cool'],
      FarmBlockV2_Berries: ['Seeding', 'Watering'], FarmBlockV2_Carrot: ['Seeding', 'Watering'],
      FarmBlockV2_Lettuce: ['Seeding', 'Watering'], FarmBlockV2_Onion: ['Seeding', 'Watering'],
      FarmBlockV2_Potato: ['Seeding', 'Watering'], FarmBlockV2_tomato: ['Seeding', 'Watering'],
      FarmBlockV2_wheet: ['Seeding', 'Watering'],
    };

    // Facility MapObjectIds worth calling out with an icon; everything else
    // in base1_facilities/base2_facilities still counts toward the total
    // and appears in the plain chip list under its official name, just
    // without an icon.
    const FACILITY_ICONS = {
      ElectricGenerator: '⚡', ElectricGenerator_Large: '⚡',
      AncientElectricGenerator: '⚡',
      EnergyStorage_Electric: '🔋',
      ItemChest: '📦', ItemChest_02: '📦', ItemChest_03: '📦',
      GuildChest: '📦', Container01_Iron: '📦',
      PalFoodBox: '🍖', MonsterFarm: '🐾', BreedFarm: '🥚',
    };

    // Power: consume_energy_speed (per-facility-type, fixed — not
    // pal-dependent) comes straight from the game's own building data
    // (BUILDINGS_META, vendored alongside the other *_meta.json files), so
    // consumption is fully grounded.
    //
    // Current charge / capacity (each base's *_power_storage) is real save
    // data: generators and the battery carry a live "current charge" float
    // in their raw bytes (backend-parsed — see POWER_STORAGE_TYPES in
    // update_pal_base_data.py for the validation: re-read ~40 minutes
    // apart in the same session, values had moved off their round
    // starting points instead of staying fixed). The capacities there are
    // calibrated against real readings, not taken from the wiki, whose
    // figures those readings contradict.
    //
    // Generation *rate* has no equivalent field anywhere in the save, so
    // this is estimated from two wiki numbers multiplied together:
    // - GENERATOR_SPEED_BY_LEVEL: the Generating Electricity page's values
    //   table (rank 1-5 -> 250/500/1000/2000/4000 energy/sec), which is
    //   itself the regular Power Generator's output at each rank (its own
    //   coefficient is 1.0, so this table already *is* that generator's
    //   real per-rank rate).
    // - GENERATOR_COEFFICIENT: each building's own "power per worker"
    //   multiplier relative to the regular generator (confirmed against
    //   this exact server: the user checked the in-game UI and saw 1/s
    //   for the regular generator and 3/s for the large one, matching the
    //   wiki numbers exactly).
    // output = coefficient x GENERATOR_SPEED_BY_LEVEL[rank]. The Human-
    // Powered Generator explicitly needs no work suitability ("does not
    // require specific work suitability" per its wiki page), so there's
    // no rank to look up for it — it's counted flat at coefficient x the
    // rank-1 table value whenever a pal is assigned. This is the one
    // number on this dashboard that isn't grounded in the save itself.
    //
    // The Ancient Power Generator is listed in GENERATOR_TYPES but has no
    // GENERATOR_COEFFICIENT entry, which is deliberate and means two
    // different things at once: it counts toward "generators placed /
    // staffed" (leaving it out made a base whose only generator is one
    // read as having no generator at all), but its output stays
    // out of the estimate because the wiki documents no rate for it.
    const GENERATOR_TYPES = [
      'ElectricGenerator', 'ElectricGenerator_Large', 'ManualElectricGenerator',
      'AncientElectricGenerator',
    ];
    const GENERATOR_SPEED_BY_LEVEL = { 1: 250, 2: 500, 3: 1000, 4: 2000, 5: 4000 };
    function tableSpeedForRank(rank) {
      if (!rank || rank < 1) return 0;
      if (GENERATOR_SPEED_BY_LEVEL[rank]) return GENERATOR_SPEED_BY_LEVEL[rank];
      // Wiki only documents ranks 1-5 (a clean x2 per level); extrapolated
      // the same way for any higher rank a save might carry.
      return 250 * Math.pow(2, rank - 1);
    }
    const GENERATOR_COEFFICIENT = {
      ElectricGenerator: 1.0,
      ElectricGenerator_Large: 3.0,
      ManualElectricGenerator: 0.2,
    };
    const GENERATOR_FLAT_RATE = new Set(['ManualElectricGenerator']);
    function estimatedGenerationRate(pals) {
      let total = 0;
      for (const p of (pals || [])) {
        const coeff = GENERATOR_COEFFICIENT[p.job];
        if (!coeff) continue;
        if (GENERATOR_FLAT_RATE.has(p.job)) {
          total += coeff * GENERATOR_SPEED_BY_LEVEL[1];
          continue;
        }
        const ws = palWorkSuitability(p.type);
        const rank = (ws && ws.GenerateElectricity) || 0;
        total += coeff * tableSpeedForRank(rank);
      }
      return total;
    }

    function facilityConsumption(id) {
      const meta = BUILDINGS_META[id];
      if (!meta || meta.required_energy_type !== 'Electric') return 0;
      return meta.consume_energy_speed || 0;
    }

    // Unlike ore/wood/stone pits, the oil pump runs on its own once built
    // and powered — no pal needs to be working it (confirmed by the user
    // against live gameplay). Its Workee slot only lets a pal speed it up;
    // it isn't gated behind staffing the way the other consumers below
    // are, so it always draws its full rated power regardless of staffed
    // count.
    const UNSTAFFED_AUTO_RUN = new Set(['OilPump02']);

    // "Active" draw uses how many pals are actually working each facility
    // type in this base (already computed for the job column) as a proxy
    // for how many instances are currently drawing power, capped at the
    // placed count — a facility with a work slot but nobody in it isn't
    // pulling its full rated draw. UNSTAFFED_AUTO_RUN facilities are the
    // exception: they draw full power even unstaffed.
    function renderPower(elId, facilities, pals, storage) {
      const el = document.getElementById(elId);
      const staffedByType = {};
      for (const p of (pals || [])) {
        if (p.job) staffedByType[p.job] = (staffedByType[p.job] || 0) + 1;
      }

      const generatorRows = GENERATOR_TYPES
        .filter(id => facilities[id])
        .map(id => ({ id, count: facilities[id], staffed: Math.min(staffedByType[id] || 0, facilities[id]) }));
      const generatorTotal = generatorRows.reduce((s, r) => s + r.count, 0);
      const generatorStaffed = generatorRows.reduce((s, r) => s + r.staffed, 0);

      const consumers = Object.entries(facilities)
        .map(([id, count]) => ({ id, count, perUnit: facilityConsumption(id) }))
        .filter(c => c.perUnit > 0)
        .map(c => ({
          ...c,
          staffed: Math.min(staffedByType[c.id] || 0, c.count),
        }))
        .map(c => ({
          ...c,
          activeDraw: c.perUnit * (UNSTAFFED_AUTO_RUN.has(c.id) ? c.count : c.staffed),
          maxDraw: c.perUnit * c.count,
        }))
        .sort((a, b) => b.activeDraw - a.activeDraw);

      const activeTotal = consumers.reduce((s, c) => s + c.activeDraw, 0);

      if (generatorTotal === 0 && consumers.length === 0) {
        el.innerHTML = '<div class="empty-state">暂无电力相关设施</div>';
        return;
      }

      const genPct = generatorTotal ? Math.round(generatorStaffed / generatorTotal * 100) : 0;
      const cap = (storage && storage.capacity) || 0;
      const cur = (storage && storage.current) || 0;
      const chargePct = cap ? Math.round(cur / cap * 100) : 0;
      const genRate = estimatedGenerationRate(pals);

      // Load = actual consumption vs *generation* (not vs max-possible
      // consumption — that's a separate "满编耗电" stat above). genRate is
      // the estimate, so this inherits its uncertainty: real charge readings
      // have been observed draining even when this estimate says generation
      // comfortably exceeds consumption, meaning genRate likely runs
      // optimistic (pals aren't always at full effective speed) — shown
      // as a load ratio, not claimed as exact.
      let loadPct, loadLabel, loadColor;
      if (genRate > 0) {
        const ratio = Math.round(activeTotal / genRate * 100);
        loadPct = Math.min(100, ratio);
        loadLabel = `${ratio}%`;
        loadColor = activeTotal > genRate ? 'var(--rose)' : 'var(--amber)';
      } else if (activeTotal > 0) {
        loadPct = 100;
        loadLabel = '无发电估算，仍在耗电';
        loadColor = 'var(--rose)';
      } else {
        loadPct = 0;
        loadLabel = '—';
        loadColor = 'var(--amber)';
      }

      const chargeBar = cap ? `<div class="power-bar-row">
        <span class="power-bar-label">当前电量</span>
        <div class="power-bar-track"><div class="power-bar-fill" style="width:${chargePct}%;background-color:var(--indigo)"></div></div>
        <span class="power-bar-nums">${Math.round(cur).toLocaleString()} / ${cap.toLocaleString()}</span>
      </div>` : '';

      const summary = `<div class="power-summary">
        <div class="power-stat">
          <span class="power-stat-label">当前耗电</span>
          <span class="power-stat-val">${activeTotal.toLocaleString()}</span>
        </div>
        <div class="power-stat">
          <span class="power-stat-label">预计发电</span>
          <span class="power-stat-val">${genRate.toLocaleString()}</span>
        </div>
      </div>
      ${chargeBar}
      <div class="power-bar-row">
        <span class="power-bar-label">发电上岗</span>
        <div class="power-bar-track"><div class="power-bar-fill" style="width:${genPct}%;background-color:var(--cyan)"></div></div>
        <span class="power-bar-nums">${generatorStaffed} / ${generatorTotal}</span>
      </div>
      <div class="power-bar-row">
        <span class="power-bar-label">耗电负载</span>
        <div class="power-bar-track"><div class="power-bar-fill" style="width:${loadPct}%;background-color:${loadColor}"></div></div>
        <span class="power-bar-nums">${loadLabel}</span>
      </div>`;

      const rows = consumers.length ? `<table class="suit-table">
        <thead><tr><th>设备</th><th>在岗</th><th>耗电</th></tr></thead>
        <tbody>${consumers.map(c => {
          const autoRun = UNSTAFFED_AUTO_RUN.has(c.id);
          const underStaffed = !autoRun && c.staffed < c.count;
          const staffLabel = autoRun ? `${c.count} 自动` : `${c.staffed}/${c.count}`;
          return `<tr>
            <td>${facilityName(c.id)}</td>
            <td class="${underStaffed ? 'short' : 'ok'}">${staffLabel}</td>
            <td>${c.activeDraw.toLocaleString()}/${c.maxDraw.toLocaleString()}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>` : '';

      el.innerHTML = summary + rows;
    }

    function renderFacilities(chipsId, totalId, facilities) {
      const chipsEl = document.getElementById(chipsId);
      const totalEl = document.getElementById(totalId);
      const entries = Object.entries(facilities || {});
      const total = entries.reduce((sum, [, n]) => sum + n, 0);
      totalEl.textContent = total ? `共 ${total} 座` : '';
      if (entries.length === 0) {
        chipsEl.innerHTML = '<div class="empty-state">暂无数据</div>';
        return;
      }
      entries.sort((a, b) => b[1] - a[1]);
      chipsEl.innerHTML = entries.map(([id, count]) => {
        const icon = FACILITY_ICONS[id];
        const cls = icon ? 'facility-chip highlight' : 'facility-chip';
        const label = icon ? `${icon} ${facilityName(id)}` : facilityName(id);
        return `<span class="${cls}">${label} <b>×${count}</b></span>`;
      }).join('');
    }

    // 一次加工材料 — one crafting step away from something gathered,
    // as opposed to the ore/wood/crop/pal-drop items that come straight
    // out of the ground, a tree, a plot or a pal. Same policy as
    // isResourceItem: the game's own item categories decide, not a
    // hand-typed list, so anything a future update adds files itself.
    // type_b MaterialIngot is everything a furnace smelts (including
    // Charcoal), MaterialProccessing everything a workbench-class station
    // turns raw material into (cloth, nails, planks, cement, circuit
    // boards, polymer…).
    //
    // The two overrides are items whose category describes what the thing
    // *is* rather than where it comes from: Flour files as FoodVegetable
    // but comes out of the Flour Mill, and Paldium Fragment files as
    // MaterialOre but is crushed from Stone at the Crusher (the same two
    // corrections the backend's CRAFTED_ITEM_OVERRIDES makes, for the
    // same reason — kept in step with it deliberately).
    const PROCESSED_TYPE_B = new Set(['MaterialIngot', 'MaterialProccessing']);
    const PROCESSED_ITEM_OVERRIDES = new Set(['Flour', 'Pal_crystal_S']);
    function isProcessedItem(id) {
      if (PROCESSED_ITEM_OVERRIDES.has(id)) return true;
      const meta = ITEMS_META[id];
      return !!meta && PROCESSED_TYPE_B.has(meta.type_b);
    }

    // What kind of thing each item is, taken from the game's own item
    // category (type_b) rather than a hand-typed list of item ids — the
    // same source the raw/processed split itself uses. It's a glyph per
    // category, not per item: the point is to make a grid of 40 tiles
    // sort itself into ore / wood / crops / drops at a glance, not to
    // illustrate each item.
    const ITEM_TYPE_ICON = {
      MaterialOre: '⛏️', MaterialStone: '🪨', MaterialWood: '🪵',
      MaterialIngot: '🔩', MaterialProccessing: '⚙️', MaterialJewelry: '💎',
      MaterialMonster: '🧬', MaterialPalEgg: '🥚', MaterialPalSphere: '🔵',
      FoodMeat: '🍖', FoodVegetable: '🌿', Drug: '💊',
    };
    function itemIcon(id) {
      if (PROCESSED_ITEM_OVERRIDES.has(id)) return '⚙️';
      const meta = ITEMS_META[id];
      return (meta && ITEM_TYPE_ICON[meta.type_b]) || '📦';
    }

    // Rows past this are hidden until "展开全部" — must match the
    // .resource-grid.truncated nth-child rule in the stylesheet, which is
    // what actually does the hiding.
    const RESOURCE_TRUNCATE_AT = 12;

    // Two grids per base rather than one merged list: 原材料 (what the
    // base gathers or grows) and 一次加工材料 (what it smelts or crafts
    // from those), because they answer different questions — the first is
    // "is the mining keeping up", the second "is the processing chain
    // moving" — and a single count-sorted list interleaved them.
    // Both are filtered to real base materials by isResourceItem (see its
    // comment) so this doesn't turn into a dump of every quest item and
    // potion in a chest. Each row shows "已入库" plus an amber "+N 待收集"
    // badge when a gathering node is sitting on some.
    function renderResources(prefix, stored, pending) {
      const ids = new Set([...Object.keys(stored || {}), ...Object.keys(pending || {})]);
      const rows = [...ids].filter(isResourceItem).map(id => ({
        id, stored: (stored && stored[id]) || 0, pending: (pending && pending[id]) || 0,
      }));
      const byStock = (a, b) => (b.stored - a.stored) || (b.pending - a.pending);
      // Raw materials keep the minerals-first order: what's visible before
      // "展开全部" should be the ore/stone/coal side of the base, not
      // berries or fiber. Processed goods have no such split — they're all
      // one kind of thing — so stock order alone is enough.
      const raw = rows.filter(r => !isProcessedItem(r.id))
        .sort((a, b) => (isMineral(b.id) - isMineral(a.id)) || byStock(a, b));
      const processed = rows.filter(r => isProcessedItem(r.id)).sort(byStock);
      renderResourceGroup(`${prefix}-res-raw`, raw);
      renderResourceGroup(`${prefix}-res-proc`, processed);
    }

    function renderResourceGroup(gridId, rows) {
      const el = document.getElementById(gridId);
      const count = document.getElementById(`${gridId}-count`);
      const btn = document.getElementById(`${gridId}-toggle`);
      count.textContent = rows.length ? `${rows.length} 种` : '0 种';
      // Nothing to expand when everything already fits — the button would
      // just be a control that does nothing.
      btn.style.display = rows.length > RESOURCE_TRUNCATE_AT ? '' : 'none';
      if (!rows.length) {
        el.innerHTML = '<div class="empty-state">暂无</div>';
        return;
      }
      // Bars are scaled against the largest stock in this group, not a
      // fixed target: there is no "correct" amount of stone to hold, so
      // the only honest comparison is against the rest of the group.
      const top = Math.max(...rows.map(r => r.stored + r.pending), 1);
      el.innerHTML = rows.map(r => {
        const total = r.stored + r.pending;
        const pct = Math.max(2, Math.round(total / top * 100));
        return `<div class="res-tile" title="${itemName(r.id)}：已入库 ${r.stored.toLocaleString()}${
          r.pending ? `，待收集 ${r.pending.toLocaleString()}` : ''}（本组最大库存的 ${Math.round(total / top * 100)}%）">
          <div class="res-tile-top">
            <span class="res-ico">${itemIcon(r.id)}</span>
            <span class="resource-name">${itemName(r.id)}</span>
          </div>
          <div class="res-tile-num">
            <span class="resource-count">${r.stored.toLocaleString()}</span>
            ${r.pending ? `<span class="resource-pending">+${r.pending.toLocaleString()} 待收</span>` : ''}
          </div>
          <div class="res-bar"><i style="width:${pct}%"></i></div>
        </div>`;
      }).join('');
    }

    // "Core output per hour": gross production, not the net-of-consumption
    // trend the (deferred) gap list uses. Each base's gross_rate is
    // computed backend-side by walking every consecutive pair of history snapshots
    // and summing only the *increases* in (stored + pending) combined — so
    // an item being mined just as fast as it's being crafted away still
    // shows up here, where a plain endpoint-to-endpoint delta would read
    // as zero or negative. See compute_resource_gross_rate()'s docstring
    // in palmon/metrics.py for the exact method and its limits.
    function renderRates(elId, grossRate) {
      const el = document.getElementById(elId);
      const minutes = (grossRate && grossRate.minutes) || 0;
      if (minutes === 0) {
        el.innerHTML = '<div class="empty-state">数据采集中，约需1小时积累趋势…</div>';
        return;
      }
      const gains = (grossRate.items || [])
        .filter(t => isResourceItem(t.item))
        .map(t => ({ item: t.item, perHour: t.gross_gain * 60 / minutes }))
        .sort((a, b) => b.perHour - a.perHour)
        .slice(0, 8);
      if (gains.length === 0) {
        el.innerHTML = `<div class="empty-state">近 ${minutes} 分钟没有观测到产出</div>`;
        return;
      }
      // The unit lives in the section heading, not on all eight rows —
      // "/ 小时" repeated down a column is noise the eye has to skip past
      // to compare the numbers it's actually there for.
      const top = Math.max(...gains.map(g => g.perHour), 1);
      el.innerHTML = gains.map(g => `<div class="rate-row">
        <div class="rate-line">
          <span class="rate-name">${itemIcon(g.item)} ${itemName(g.item)}</span>
          <span class="rate-val">+${Math.round(g.perHour).toLocaleString()}</span>
        </div>
        <div class="res-bar rate-bar"><i style="width:${Math.max(2, Math.round(g.perHour / top * 100))}%"></i></div>
      </div>`).join('') + `<div class="gap-window">近 ${minutes} 分钟推算</div>`;
    }

    // Satiety (hunger) restored per item — see SATIETY_VALUES in
    // update_pal_base_data.py for sourcing and why it's deliberately
    // partial (no verified value for most pal-specific meat/dish
    // variants). Backend excludes unmapped items from the satiety total
    // and reports them separately by raw item count instead of hiding
    // them. Consumption is each present pal's own food_amount stat
    // (also from vendored game data) summed up, not a history-based
    // rate — Food Box contents get moved around by hand too, so a raw
    // item-count delta can't tell a pal eating apart from a player
    // restocking/withdrawing, which made the earlier rate-based version
    // unreliable.
    function renderFood(elId, storage, consumption) {
      const el = document.getElementById(elId);
      if (!storage) { el.textContent = ''; return; }
      const unmappedCount = Object.keys(storage.unmapped_items || {}).length;
      const titleParts = [
        '消耗值为帕鲁自身"食量"属性之和，不是每小时/每分钟的实时速率；耗尽预计基于饱食度历史的实际下降速度推算。',
      ];
      if (unmappedCount) {
        titleParts.push(`另有 ${unmappedCount} 种食物饱食度数值未核实，未计入总量：${
          Object.entries(storage.unmapped_items).map(([id, c]) => `${itemName(id)}×${c}`).join('、')
        }`);
      }
      el.title = titleParts.join('\n');
      const etaText = storage.hours_remaining != null
        ? ` · 预计 ${storage.hours_remaining}h 后耗尽`
        : '';
      el.textContent = `🍖 饱食度 ${storage.satiety_total.toLocaleString()} · 消耗值 ${(consumption || 0).toLocaleString()}${unmappedCount ? ' *' : ''}${etaText}`;
      // An empty food box starves the whole base — it belongs in the alert
      // colours, not in the same faint grey as the rest of the header line.
      // Thresholds match the depletion estimate the text already carries:
      // out now, or under two hours left.
      const hours = storage.hours_remaining;
      const critical = storage.satiety_total <= 0 || (hours != null && hours <= 0);
      const low = !critical && hours != null && hours <= 2;
      el.classList.toggle('critical', critical);
      el.classList.toggle('low', low);
    }

    // ─── Crafting calculator ───
    // Answers one question: with what this base actually has in storage right
    // now, how many of this can be made. Recipes come from data/recipes.json
    // (build_recipe_data.py), stock from the same base payload every other
    // panel reads, so the two can never disagree with each other.
    const CRAFT_CATS = [
      { key: 'ALL', label: '全部' }, { key: 'MAT', label: '材料' }, { key: 'FOOD', label: '食物' },
      { key: 'CONSUME', label: '消耗品' }, { key: 'AMMO', label: '弹药' }, { key: 'WEAPON', label: '武器' },
      { key: 'ARMOR', label: '防具' }, { key: 'ACC', label: '配件' }, { key: 'GEAR', label: '帕鲁装备' },
      { key: 'SPHERE', label: '球 / 模组' }, { key: 'BP', label: '图纸' }, { key: 'BUILD', label: '建筑' },
      { key: 'OTHER', label: '其他' },
    ];
    // Category is the game's own item type, not a hand-sorted list.
    const CRAFT_CAT_BY_TYPE_A = {
      Material: 'MAT', Food: 'FOOD', Weapon: 'WEAPON', SpecialWeapon: 'WEAPON',
      Armor: 'ARMOR', Accessory: 'ACC', Ammo: 'AMMO', Consume: 'CONSUME',
      Blueprint: 'BP', Essential: 'GEAR', SphereModule: 'SPHERE', Glider: 'GEAR',
    };

    let CRAFT_INDEX = [];
    // Only as many rows as stay responsive to scroll and re-render; the search
    // box is the way past it, and the list says how many it is hiding.
    const CRAFT_LIST_LIMIT = 200;

    const craftState = {
      base: uiState['craft:base'] || 'all',
      pending: uiState['craft:pending'] === true,
      cat: uiState['craft:cat'] || 'ALL',
      q: '',
      selected: uiState['craft:sel'] || null,
      qty: null,
      // null = follow whichever recipe current stock does best with; a number
      // pins the one the reader picked.
      variant: null,
    };

    function setCraftVariant(i) {
      craftState.variant = i;
      craftState.qty = null;
      renderCraftDetail();
    }

    function buildCraftIndex() {
      const rows = [];
      // One entry per *product*, not per recipe. Several things have more
      // than one way to be made — Paldium Fragment alone has thirteen, one
      // per sphere tier you can break down — and a row each meant the list
      // showed the same name over and over with no way to tell which was
      // which. The variants live inside the entry and the detail panel
      // switches between them.
      for (const [id, list] of Object.entries(RECIPES.items || {})) {
        const meta = ITEMS_META[id] || {};
        const cat = meta.type_b === 'SPWeaponCaptureBall' ? 'SPHERE'
          : (CRAFT_CAT_BY_TYPE_A[meta.type_a] || 'OTHER');
        rows.push({
          kind: 'item', id, name: itemName(id), cat, sort: meta.sort_id || 0,
          recipes: list.map(r => ({
            materials: r.materials, count: r.count || 1, work: r.work || 0,
            ambiguous: r.ambiguous || null,
          })),
        });
      }
      for (const [id, r] of Object.entries(RECIPES.buildings || {})) {
        rows.push({
          kind: 'building', id, name: facilityName(id), cat: 'BUILD', sort: 0,
          recipes: [{ materials: r.materials, count: 1, work: r.work || 0, ambiguous: null }],
        });
      }
      CRAFT_INDEX = rows;
      renderCraftCats();
      renderCraftBaseChips();
      renderCraftList();
      renderCraftDetail();
    }

    // Stock the calculator counts against. "待收集" is the gathering nodes'
    // own buffers — the material exists at the base but no pal has carried it
    // to a chest yet, so it's off by default rather than silently counted.
    function craftInventory() {
      const inv = {};
      const keys = craftState.base === 'all' ? BASES.map(b => b.key) : [craftState.base];
      for (const key of keys) {
        const stored = (lastData && lastData[`${key}_resources`]) || {};
        for (const [id, n] of Object.entries(stored)) inv[id] = (inv[id] || 0) + n;
        if (craftState.pending) {
          const pend = (lastData && lastData[`${key}_resources_pending`]) || {};
          for (const [id, n] of Object.entries(pend)) inv[id] = (inv[id] || 0) + n;
        }
      }
      return inv;
    }

    // The same numbers craftInventory() sums, kept split by base instead:
    // {itemId: {baseKey: count}}. Always covers every base, not just the
    // selected source — half the point of showing where stock is, is showing
    // the base you are *not* counting.
    function craftStockByBase() {
      const map = {};
      for (const b of BASES) {
        const parts = [(lastData && lastData[`${b.key}_resources`]) || {}];
        if (craftState.pending) parts.push((lastData && lastData[`${b.key}_resources_pending`]) || {});
        for (const part of parts) {
          for (const [id, n] of Object.entries(part)) {
            if (!n) continue;
            (map[id] = map[id] || {})[b.key] = (map[id][b.key] || 0) + n;
          }
        }
      }
      return map;
    }

    // Batches, not items: a recipe that yields 10 arrows can only be run whole.
    function craftBatches(recipe, inv) {
      let batches = Infinity;
      for (const [mid, need] of recipe.materials) {
        if (!need) continue;
        batches = Math.min(batches, Math.floor((inv[mid] || 0) / need));
      }
      return Number.isFinite(batches) ? Math.max(0, batches) : 0;
    }

    // Which of a product's recipes current stock does best with, and how many
    // that is. Ties keep the earlier recipe, which is the game's own order.
    function craftBestVariant(entry, inv) {
      let best = { index: 0, items: -1, batches: 0 };
      entry.recipes.forEach((r, index) => {
        const batches = craftBatches(r, inv);
        const items = batches * r.count;
        if (items > best.items) best = { index, items, batches };
      });
      return best;
    }

    // Same idea one level down, for the "you could make the missing material"
    // hint: the variant that current stock makes the most of.
    function bestSubRecipe(itemId, inv) {
      const list = RECIPES.items[itemId] || [];
      let best = null;
      for (const r of list) {
        const yieldable = craftBatches(r, inv) * (r.count || 1);
        if (!best || yieldable > best.yieldable) best = { recipe: r, yieldable };
      }
      return best;
    }

    // "You can just buy this": every shop selling the item, cheapest first,
    // with where that shop stands. Locations are only as specific as the
    // source is — the four roaming spots carry map coordinates, settlement
    // merchants carry the settlement's name, and the caravan carries neither
    // because it comes to you.
    function merchantHint(itemId) {
      const offers = MERCHANTS.items[itemId];
      if (!offers || !offers.length) return '';
      const seen = new Set();
      const parts = offers
        .slice()
        .sort((a, b) => (a.price || 0) - (b.price || 0))
        .map(o => {
          const shop = MERCHANTS.shops[o.shop] || {};
          const locs = (shop.locations || []).map(l =>
            l.coords ? `${l.name} (${l.coords[0]}, ${l.coords[1]})` : l.name).join(' / ');
          const where = locs || shop.note || '';
          const price = o.price != null ? `${o.price.toLocaleString()} ${itemName(o.currency)}` : '';
          return { key: `${shop.merchant}|${where}`, text: `${shop.merchant || o.shop}${price ? ` ${price}` : ''}${where ? ` — ${where}` : ''}` };
        })
        // The same merchant can appear once per shop group (the desert red
        // and green coats both stand in Duneshelter); one line each is enough.
        .filter(x => !seen.has(x.key) && seen.add(x.key));
      return `<span class="craft-buy">🛒 可购买：${parts.map(x => x.text).join('；')}</span>`;
    }

    function craftName(entry) {
      return entry.kind === 'building' ? facilityName(entry.id) : itemName(entry.id);
    }

    function setCraftBase(key) {
      craftState.base = key;
      uiState['craft:base'] = key;
      saveUiState();
      renderCraftBaseChips();
      renderCraftList();
      renderCraftDetail();
    }
    function setCraftPending(on) {
      craftState.pending = !!on;
      uiState['craft:pending'] = craftState.pending;
      saveUiState();
      renderCraftList();
      renderCraftDetail();
    }
    function setCraftCat(cat) {
      craftState.cat = cat;
      uiState['craft:cat'] = cat;
      saveUiState();
      renderCraftCats();
      renderCraftList();
    }
    function setCraftQuery(q) {
      craftState.q = (q || '').trim().toLowerCase();
      renderCraftList();
    }
    function selectCraft(kind, id) {
      craftState.selected = `${kind}:${id}`;
      craftState.qty = null;
      craftState.variant = null;
      uiState['craft:sel'] = craftState.selected;
      saveUiState();
      renderCraftList();
      renderCraftDetail();
    }
    function setCraftQty(v) {
      const n = parseInt(v, 10);
      craftState.qty = Number.isFinite(n) && n > 0 ? n : 1;
      renderCraftDetail();
    }

    function renderCraftCats() {
      const el = document.getElementById('craft-cats');
      if (!el) return;
      const counts = {};
      for (const r of CRAFT_INDEX) counts[r.cat] = (counts[r.cat] || 0) + 1;
      el.innerHTML = CRAFT_CATS.filter(c => c.key === 'ALL' || counts[c.key])
        .map(c => `<button class="craft-chip ${craftState.cat === c.key ? 'active' : ''}" onclick="setCraftCat('${c.key}')">
          ${c.label} <span class="pfc-count">${c.key === 'ALL' ? CRAFT_INDEX.length : counts[c.key]}</span>
        </button>`).join('');
    }

    function renderCraftBaseChips() {
      const el = document.getElementById('craft-base-chips');
      if (!el) return;
      const opts = [{ key: 'all', label: '全部据点合计' }]
        .concat(BASES.map(b => ({ key: b.key, label: `${b.icon} ${b.label}` })));
      if (!BASES.some(b => b.key === craftState.base) && craftState.base !== 'all') craftState.base = 'all';
      el.innerHTML = opts.map(o => `<button class="craft-chip ${craftState.base === o.key ? 'active' : ''}" onclick="setCraftBase('${o.key}')">${o.label}</button>`).join('');
    }

    function craftFiltered() {
      const q = craftState.q;
      return CRAFT_INDEX.filter(r => {
        if (craftState.cat !== 'ALL' && r.cat !== craftState.cat) return false;
        if (!q) return true;
        return craftName(r).toLowerCase().includes(q) || r.id.toLowerCase().includes(q);
      });
    }

    function renderCraftList() {
      const el = document.getElementById('craft-list');
      if (!el) return;
      if (!CRAFT_INDEX.length) { el.innerHTML = '<div class="empty-state">配方载入中…</div>'; return; }
      const inv = craftInventory();
      const rows = craftFiltered().map(r => ({ r, can: craftBestVariant(r, inv).items }));
      // Craftable first — the list exists to answer "what can I make now" —
      // then items before buildings (there are 496 buildings, mostly walls
      // and floors, and they used to bury every item under them), then in
      // the game's own item order so a category reads familiarly.
      rows.sort((a, b) => (b.can > 0) - (a.can > 0)
        || (a.r.kind === 'building') - (b.r.kind === 'building')
        || a.r.sort - b.r.sort
        || craftName(a.r).localeCompare(craftName(b.r), 'zh-Hans'));
      const head = document.getElementById('craft-list-head');
      const shown = rows.slice(0, CRAFT_LIST_LIMIT);
      if (head) {
        const canCount = rows.filter(x => x.can > 0).length;
        head.textContent = rows.length
          ? `${rows.length} 种可制作物 · 现有材料可做 ${canCount} 种${rows.length > shown.length ? `（列出前 ${shown.length} 个，可用搜索缩小范围）` : ''}`
          : '没有匹配的配方';
      }
      if (!rows.length) { el.innerHTML = '<div class="empty-state">没有匹配的配方</div>'; return; }
      // Land on something rather than an empty right-hand panel: the top row
      // is the most craftable thing in the current filter, which is as good a
      // starting point as any.
      if (!CRAFT_INDEX.some(r => `${r.kind}:${r.id}` === craftState.selected)) {
        const first = shown[0].r;
        craftState.selected = `${first.kind}:${first.id}`;
        craftState.qty = null;
        renderCraftDetail();
      }
      el.innerHTML = shown.map(({ r, can }) => {
        const key = `${r.kind}:${r.id}`;
        const tag = r.kind === 'building' ? '<span class="craft-row-tag">建筑</span>' : '';
        return `<button class="craft-row ${craftState.selected === key ? 'active' : ''}" onclick="selectCraft('${r.kind}','${r.id}')">
          <span class="res-ico">${r.kind === 'building' ? '🏗️' : itemIcon(r.id)}</span>
          <span class="craft-row-name">${craftName(r)}</span>
          ${r.recipes.length > 1 ? `<span class="craft-row-tag">${r.recipes.length} 种配方</span>` : ''}
          ${tag}
          <span class="craft-row-can ${can ? '' : 'zero'}">${can ? `可做 ${can.toLocaleString()}` : '材料不足'}</span>
        </button>`;
      }).join('');
    }

    function renderCraftDetail() {
      const el = document.getElementById('craft-detail');
      if (!el) return;
      const note = document.getElementById('craft-source-note');
      if (note) {
        const label = craftState.base === 'all' ? '全部据点合计'
          : ((BASES.find(b => b.key === craftState.base) || {}).label || craftState.base);
        note.textContent = `库存：${label}${craftState.pending ? '（含待收集）' : ''}`;
      }
      if (!CRAFT_INDEX.length) return;
      const entry = CRAFT_INDEX.find(r => `${r.kind}:${r.id}` === craftState.selected);
      if (!entry) { el.innerHTML = '<div class="empty-state">从左侧选择一个配方</div>'; return; }

      const inv = craftInventory();
      // Which recipe this panel is about: the reader's pick, or the one
      // current stock does best with.
      const best = craftBestVariant(entry, inv);
      const vIdx = craftState.variant != null && entry.recipes[craftState.variant]
        ? craftState.variant : best.index;
      const recipe = entry.recipes[vIdx];
      const maxBatches = craftBatches(recipe, inv);
      const maxItems = maxBatches * recipe.count;

      // Summing every base can promise a craft that no single base can
      // actually run — the materials are real but sitting in three different
      // chests. When that's the case, say what one base can do on its own.
      let bestSingle = null;
      if (craftState.base === 'all' && BASES.length > 1) {
        for (const b of BASES) {
          const stored = (lastData && lastData[`${b.key}_resources`]) || {};
          const one = { ...stored };
          if (craftState.pending) {
            for (const [id, n] of Object.entries((lastData && lastData[`${b.key}_resources_pending`]) || {})) {
              one[id] = (one[id] || 0) + n;
            }
          }
          const items = craftBatches(recipe, one) * recipe.count;
          if (!bestSingle || items > bestSingle.items) bestSingle = { base: b, items };
        }
      }
      // Target defaults to one batch — the smallest thing you can actually run.
      const target = craftState.qty || recipe.count;
      const batches = Math.ceil(target / recipe.count);

      const byBase = craftStockByBase();
      const counted = key => craftState.base === 'all' || craftState.base === key;

      const rows = recipe.materials.map(([mid, need]) => {
        const have = inv[mid] || 0;
        const want = need * batches;
        const gap = Math.max(0, want - have);

        // Where the material actually sits. Bases outside the selected
        // source are shown too, dimmed — "2号据点 makes this and has 3,000"
        // is the answer to a shortage at 3号据点, and summing everything
        // into one number hides exactly that.
        const spread = BASES
          .map(b => ({ b, n: (byBase[mid] || {})[b.key] || 0 }))
          .filter(x => x.n > 0)
          .sort((x, y) => y.n - x.n);
        const where = spread.length
          ? `<span class="craft-where">${spread.map(x =>
              `<span class="cw-chip ${counted(x.b.key) ? '' : 'other'}" style="--c:${x.b.color}" title="${
